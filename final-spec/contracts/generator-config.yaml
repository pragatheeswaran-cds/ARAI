version: '1.2'
status: engineering defaults; tune on development only before validation; record changes
snapshot: '2026-09-09T23:59:59+05:30'
history_start: '2025-09-10'
timezone: Asia/Kolkata
currency: INR
source_assets:
  catalog: assets/sku_master_source.csv
  profiles: assets/profile-config.yaml
  festive: assets/festive-windows.yaml
  reasons: assets/reason_codes.csv
accepted_settings:
  customers: 10000
  household_member_share: 0.12
  household_size:
  - 2
  - 5
  grouped_propensity_share: 0.4
  abuse_group_size:
  - 3
  - 6
  shared_location_share:
  - 0.01
  - 0.02
  shared_location_size:
  - 26
  - 60
  heavy_return_share: 0.06
  heavy_return_range:
  - 0.28
  - 0.48
  power_user_share: 0.08
  defect_style_share: 0.08
  action_rate_mean_per_relevant_order: 0.2
  cancel_probability: 0.03
  dispatch_days:
  - 0
  - 2
  carrier_regular_days:
  - 2
  - 7
  carrier_tail_probability: 0.05
  carrier_tail_days:
  - 8
  - 12
  loss_probability_of_shipped: 0.003
  basket: min(6,1+Poisson(.6))
  quantity_values:
  - 1
  - 2
  - 3
  quantity_probabilities:
  - 0.92
  - 0.07
  - 0.01
  no_discount_probability: 0.55
  discount_steps:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  free_shipping_subtotal: 999
  otherwise_shipping: 49
  item_refund_days:
  - 3
  - 10
  no_item_refund_days:
  - 1
  - 5
  in_window_rejection_probability: 0.02
  honest_withdraw_probability: 0.03
  max_late_request_share: 0.02
  channels:
    courier_pickup: 0.8
    drop_off_point: 0.12
    post: 0.08
  refund_methods:
    original_payment: 0.7
    store_credit: 0.25
    gift_card: 0.05
  temp_reason_mix:
    fit_or_discretionary: 0.85
    false_quality: 0.15
  genuine_claim_rates:
    item_not_received: 0.005
    wrong_item_sent: 0.004
    missing_parts: 0.004
    empty_package: 0.002
  carrier_damage_rate: 0.005
consolidation_defaults:
  note: New explicit engineering choices, not claims of prior user-selected numbers
    or market facts. Freeze after small-world diagnostics.
  integer_range_sampling: discrete uniform unless profile says otherwise
  continuous_range_sampling: uniform
  defect_unit_probability:
    ordinary_style: 0.01
    defect_prone_style: 0.25
  ordinary_category_rate:
    T-shirt: 0.15
    Shirt: 0.18
    Jeans: 0.2
    Jacket: 0.15
    Dress: 0.22
  ordinary_logit:
    base: logit(profile honest target clipped[.001,.999]) + logit(category_rate)-logit(.20)
    bracketing_increment: 0.5
    fit_issue_increment: 0.7
    defective_unit_increment: 1.5
    noise_normal_sd: 0.35
  honest_cause_priority:
  - genuine_fulfilment_failure
  - carrier_damage
  - latent_defect
  - ordinary_fit_preference
  reason_selection: uniform within applicable declared reason group; ordinary fit
    vs discretionary equal probability
  claim_action_selection: nonreceipt vs contents equal probability; contents codes
    uniform
  request_latency:
    honest: round(Beta(2,5)*captured_window)
    temporary_use: round(Beta(5,2)*captured_window)
    solo_claim: discrete_uniform(0,min(10,window))
    late: at most floor(.02*submitted_count) seeded requests reassigned to uniform(window+1,2*window)
      if visible; else opportunity uncompleted
  campaign_gamma:
    shape: 2.0
    scale_days: 3.0
    truncate_after_days: 30
    origin: delivered_date of the claimed unit
  campaign_matching: reuse a compatible unreserved unit of the date's style delivered
    in the 14 days up to the campaign date; otherwise place a campaign order (amendment_1_1)
  festive_discount: conditional on discount, uniform .25,.30,.35,.40 rather than all
    steps
  loss_confirmation: shipping_date+12 days; earlier cutoff remains shipped
  return_receipt: 'item required: requested date+2 days if observed; no-item null'
  refund: never before receipt for item returns; pending if due date beyond cutoff
  signup: sample tenure from persona bounds, subtract from snapshot; purchases restricted
    to history
  order_count: draw target from config then Poisson intensity distributed over eligible
    calendar dates; targets not quotas
  sku_choice: uniform style then available SKU, excluding not-yet-launched variants
  rng: NumPy PCG64, independent seed derived from SHA256(world_seed|entity_key|purpose),
    first128 bits
  quantiles: linear interpolation
amendment_1_1:
  note: Added 2026-10-02. Engineering defaults; confirm on development worlds before
    validation. Calibration may change only the three levers named in experiment.yaml
    difficulty_calibration.
  action_rate:
    distribution: Beta(1.2, 4.8) per positive-propensity account and enabled family
    mean: 0.2
    applies_to: solo opportunities per relevant base-layer delivered order
  temporary_use_occasion_weighting:
    occasion_order_multiplier: 2.5
    other_order_multiplier: 0.55
    rule: probability = clip(action_rate * multiplier, 0, 1); an unreserved delivered
      occasion-wear unit is used when present
  campaigns:
    world_hot_list_size: 4
    hot_list_weight: median catalog unit price of the style
    hot_list_eligibility: at least one SKU launched by history_start
    group_target_styles:
    - 1
    - 2
    group_campaign_dates:
    - 2
    - 4
    campaign_date_sampling: uniform between ring formation and the snapshot; one group
      style per date
    ring_formation: latest signup among the ring's claim-capable members, not before
      history_start; a ring without claim-capable members plans nothing
    participant_probability_per_date: 0.6
    participants: claim-capable members only
    reuse_window_days_before_campaign_date: 14
    campaign_order:
      order_date_offset_days:
      - 0
      - 2
      lines: 1
      quantity: 1
      sku_choice: uniform launched SKU of the date's style
      rules: ordinary pricing, discount, shipping, identifier usage and fulfilment
      layer: abuse; private order_truth only; separate keyed ID stream; no honest events;
        no solo opportunities
    uncompleted_reasons:
    - pre_signup
    - pre_launch
    - after_cutoff
    - cancelled
    - lost_in_transit
    - undelivered_by_cutoff
    - claim_after_cutoff
  genuine_failure_address_multiplier:
    distribution: Z^2 with Z standard normal (Gamma shape 0.5, scale 2); mean 1, variance
      2
    key: world and address_id
    applies_to: item_not_received, wrong_item_sent, missing_parts and empty_package
      rates
    clip: probability at most 1
    excludes: carrier_damage
  targeting_truth:
    min_accounts_per_group: 3
  emitted_constants:
    order_channel:
      mobile_app: 0.6
      web: 0.3
      marketplace: 0.1
    loyalty_tier: unknown
    marketing_channel: unknown
    reason_text: null
    disposition: null
amendment_1_2:
  note: Added 2026-10-02 after the first fixture worlds. See records/ in the code repository
    for the evidence. These clarify scope; they add no new mechanism.
  tenure: Dormant, Occasional, Seasonal and Loyalist tenures reach 1095 days (assets/profile-config.yaml);
    order targets cover the history window only
  max_order_intensity_per_day: 1.0
  power_user_scope: Loyalist accounts only (power_user_share is a share of Loyalists)
  defect_prone_style_count: exactly round(defect_style_share x styles), at least 1, chosen
    at random per world
