  seed: 20260926
  interval_percentiles:
  - 2.5
  - 97.5
  gate_uses: point estimates; intervals reported, not a significance claim
dependency_policy: lock exact compatible versions before accepted generation/training
fixture_seeds:
- 2001
- 2002
- 2003
fixture_customers: 1000
stress_seeds:
  5501: ordinary propensity x1.2
  5502: ordinary propensity x0.8
  5503: defect incidence x2
  5504: household share x2
  5505: per-account action rate x0.5
  5506: per-account action rate x2
  5507: actionable persona multipliers all 1
  5508: honest customers return late as in generator-config 3.0
  5509: temporary-use returns come back early as in generator-config 3.0
  5510: both return-timing changes of generator-config 3.0
  5511: generator-config 3.0 in full (both timing changes and its lower action rate)
risk_reference:
  supervised: 5-fold grouped by world; fold-local preprocessing; the category fallback is
    fitted on all training worlds and training fails if a training world uses it
  unsupervised: in-sample training scores
  baseline: training raw_return_rate
references:
  status: report-only; same population, k, ties and budgets as candidates; never gate inputs
    and never selectable
  volume_only_logreg:
    family: LogisticRegression
    params_from: logreg_c1
    inputs:
    - mature_sale_lines
    - log_order_count
  analyst_rulebook:
    score: count of fired rules (0-5)
    tie_break: descending raw_return_rate, then the standard hash
    thresholds_from: eligible training customers; linear-interpolated percentiles; frozen
    null_input: rule does not fire
    rules:
    - raw_return_rate >= training p90
    - visible transaction-claim return lines >= 2
    - requested_refund_ratio >= training p90
    - supported_neighbor_count >= 1 and own transaction-claim return lines >= 1
    - late_window_share >= 0.50 with >= 2 timed return lines
difficulty_calibration:
  status: disclosed development step; targets are not acceptance gates
  measured_on: pooled out-of-fold training-world scores at the 5% budget
  targets:
    baseline_precision:
    - 0.2
    - 0.3
    best_supervised_precision:
    - 0.75
    - 0.85
    raise_difficulty_above: 0.9
  permitted_levers:
  - action-rate Beta parameters
  - address failure multiplier dispersion
  - genuine claim rates
  forbidden: gate, truth definitions, eligibility, benign segments, household generation
  deadline: before any validation manifest exists; each change dated with before/after values
gate_dry_run:
  input: pooled out-of-fold training-world scores; Isolation Forest in-sample, flagged optimistic
  rule: identical gate, k, ties and segment definitions
  effect: diagnostic only; never selects, promotes or replaces validation
  deadline: before any validation manifest exists
