version: '4.0'
status: IMPLEMENTATION BASELINE
experiment_id: EXP-20261005-04
purpose: 'a fifth gate leg for honest customers with exactly one genuine delivery failure, training weights
  on both honest claimant groups, and a rebuilt wardrobing indicator; on new worlds from generator-config 4.0,
  which generates as generator-config 1.3 did (AM-51 to AM-54)'
expectation: stated before any world exists. On this simulator the experiment is in effect a replication of
  EXP-20261005-02 with one more leg. In exploration on that experiment's training worlds the fifth leg was met by
  every boosted candidate, weighted or not (1.5% to 4.3% reviewed against 5.0% for the rule), and the weighted
  candidates were within one point of precision of each other, so which of them is selected is not a finding.
  On generator-config 3.0 no registered candidate met all five legs in exploration; stress world 5511 shows this
  experiment's models there. A pass says the method and the wider gate hold on new worlds of the generous
  simulator, and nothing more.
data_root: data/EXP-20261005-04
data_root_note: every world, feature file, record, bundle and the local database of this experiment live under
  data_root (artifacts/, private/, postgres/), relative to the repository. The data of the superseded experiments
  stays in data/artifacts and data/private and is neither read nor written by this contract.
