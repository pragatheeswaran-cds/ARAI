eligibility:
  min_mature_sale_lines: 3
  excluded_status: insufficient_history
  report_excluded_abuse_coverage: true
budgets:
  primary_fraction: 0.05
  sensitivity_fractions:
  - 0.01
  - 0.1
  rounding: ceil
  tie_break: ascending SHA256 of world_id/customer_id with fixed public tie namespace
selection:
  aggregate: pooled confusion counts over validation worlds, with k calculated per world
  gate: precision above raw-rate baseline; FPR no higher in each benign group listed in segments
  order: descending precision, ascending worst benign-group FPR, ascending registered candidate
    ordinal
  no_pass: no_selected_model
  refit_after_selection: false
  segments:
  - legit_heavy_returner
  - defective_product_buyer
  - benign_household
  - repeat_genuine_claimant
  - one_genuine_failure
  segment_note: one_genuine_failure (honest, exactly one genuinely failed unit) is a leg of its own and is not merged
    with repeat_genuine_claimant, so that a lower review rate in one group cannot be paid for in the other (AM-53)
