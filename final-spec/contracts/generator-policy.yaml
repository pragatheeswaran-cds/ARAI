spec_version: '1.1'
status: IMPLEMENTATION BASELINE
authority: components/02-synthetic-data-generation.md
scope: Joint allocation; operational settings in generator-config.yaml.
overlay:
  denominator: all_world_accounts
  allocation_eligible: target_order_count > 0
  normalize: w_i = m_i / mean_all_accounts(m); m_i=0 for ineligible accounts
  persona_multipliers:
    Dormant: 0.0
    Occasional: 1.0
    Seasonal: 1.0
    Loyalist: 1.0
    New_Growth: 1.5
    High_Intensity: 2.0
  expected_world_marginals:
    claim: 0.04
    temporary_use: 0.03
    both: 0.005
  categorical_coefficients:
    claim_only: 0.035
    temporary_use_only: 0.025
    both: 0.005
  neither_probability: 1 - 0.065 * w_i
  stress_2507_actionable_multiplier: 1.0
  invalid_probability_policy: fail_configuration_without_clipping
  exact_realized_quotas: false
actions:
  opportunity_rate: per-account action_rate, Beta(1.2, 4.8), mean 0.2 (generator-config
    amendment_1_1)
  private_unit_key:
  - order_id
  - order_line_no
  - unit_index
  allocation_order:
  - base_purchases_and_delivery
  - honest_requests_and_reservations
  - abusive_opportunities
  reserve_withdrawn_honest_units: true
  conflict_policy: keyed_random_winner_without_forced_replacement
  preserve_base_and_honest_events_when_abuse_disabled: true
  remove_campaign_orders_when_abuse_disabled: true
  campaign_purchase_policy: reuse_compatible_purchase_else_place_abuse_layer_campaign_order
  random_streams: purpose_and_entity_keyed_independent_streams
  generator_request_availability: available_at_equals_requested_at
target_truth:
  status: completed coordinated activity
  fields:
  - planned_targeted_by
  - completed_targeted_by
  - hot_listed
  - coordinated_claim_accounts_by_group
  - targeting_level
  - targeted
  positive: one_group_with_at_least_3_accounts_completing_coordinated_claims_visible_by_cutoff
  sub_threshold: completed coordinated claims below the account minimum; reported
    separately, never positive
  detector_thresholds_define_truth: false
verification:
  persona_auc_half_for_completed_labels_required: false
  realized_member_usage_in_probability_interval_required: false
  assigned_sharing_equals_observed_graph_required: false
  preserve_failed_or_unmatched_opportunity_counts: true
  regenerate_sealed_worlds_for_coverage: false
