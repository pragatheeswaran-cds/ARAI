      parameters:
      - name: run_id
        in: path
        required: true
        schema: *id001
      - *id002
      - *id003
      - name: review_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: eligibility
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - eligible
          - insufficient_history
      - name: search
        in: query
        required: false
        schema: *id001
      - name: evidence
        in: query
        required: false
        schema: *id001
      - name: disposition
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - unreviewed
          - needs_investigation
          - likely_legitimate
          - unresolved
      - name: comparison
        in: query
        required: false
        schema:
          type: string
          default: all
          enum:
          - all
          - model_only
          - baseline_only
          - both
      - name: wardrobing
        in: query
        required: false
        description: Show only customers whose independent wardrobing indicator is in this band. A filter chooses
          what is shown; it changes no score or selection.
        schema:
          type: string
          default: all
          enum:
          - all
          - elevated
          - possible
          - no_elevated_signal
          - insufficient_evidence
          - incomplete
      - name: community
        in: query
        required: false
        description: Show only customers whose group of linked accounts is of this kind (ring, household), or only
          customers with no supported edge (none). A filter chooses what is shown; it changes no score or selection.
        schema:
          type: string
          default: all
          enum:
          - all
          - ring
          - household
          - none
      - name: community_id
        in: query
        required: false
        description: Show only the members of this community of the run, in queue order (with review_only=false, every
          member).
        schema: *id001
      - name: tier
        in: query
        required: false
        description: Show only customers of this tier (HIGH is the queue; MEDIUM scores 90 or above and is not selected; LOW
          is every other eligible customer). A filter chooses what is shown; it changes no score or selection.
        schema:
          type: string
          default: all
          enum:
          - all
          - HIGH
          - MEDIUM
          - LOW
      - name: gate
        in: query
        required: false
        description: Show only customers with this gate outcome (a presentation rule over stored results, see
          Customer.gate_outcome). A filter chooses what is shown; it changes no score or selection.
        schema:
          type: string
          default: all
          enum:
          - all
          - ESCALATE
          - HOLD
          - WARNING
          - LOW
