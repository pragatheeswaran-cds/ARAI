      properties:
        customer_id: *id001
        y_abuse:
          type: integer
          enum:
          - 0
          - 1
        action_types:
          type: array
          items: *id001
    Health:
      type: object
      additionalProperties: false
      required:
      - alive
      - scoring_ready
      - promoted_model_ready
      - model_kind
      - queue_depth
      - worker_seconds_since_seen
      properties:
        alive: *id011
        scoring_ready: *id011
        promoted_model_ready: *id011
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
          - null
          nullable: true
        queue_depth:
          type: integer
          minimum: 0
          description: Runs waiting for the worker or being scored.
        worker_seconds_since_seen:
          type: number
          nullable: true
          description: Seconds since a scoring worker last reported; null if none ever has. Informative, not part of
            scoring_ready.
    DatasetPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        next_cursor:
          type: string
          nullable: true
    RunPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_cursor:
          type: string
          nullable: true
    ScoreBin:
      type: object
      additionalProperties: false
      required:
      - lower
      - upper
      - count
      - selected_count
      - at_or_above
      properties:
        lower:
          type: number
          minimum: 0
          maximum: 100
        upper:
          type: number
          minimum: 0
          maximum: 100
        count:
          type: integer
          minimum: 0
          description: Eligible customers whose risk score is in [lower, upper); the last bin includes 100.
        selected_count:
          type: integer
          minimum: 0
          description: Of those, the customers selected for review.
        at_or_above:
          type: integer
          minimum: 0
          description: Eligible customers scoring at or above lower, which is the queue a threshold at lower would produce.
    ScoreDistribution:
      type: object
      additionalProperties: false
      required:
      - run_id
      - eligible_count
      - review_budget
      - threshold_score
      - bin_width
      - bins
      description: How the eligible customers' risk scores spread, in twenty five-point bins from 0 to 100, with the
        queue size at any threshold. Every number is a count over the run's stored rows; nothing is recomputed and no
        threshold here changes the run's selection, which stays at threshold_score.
      properties:
        run_id: *id001
        eligible_count:
          type: integer
          minimum: 0
        review_budget:
          type: integer
          minimum: 0
          nullable: true
        threshold_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        bin_width:
          type: number
        bins:
          type: array
          items:
            $ref: '#/components/schemas/ScoreBin'
    CustomerPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
