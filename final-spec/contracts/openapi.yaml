    TimelineEvent:
      type: object
      additionalProperties: false
      required:
      - source_ref
      - event_type
      - observed_at
      - description
      - amount_inr
      - style_id
      - sku
      - order_id
      - order_line_no
      - quantity
      - size
      - reason_code
      - reason_group
      - day_in_window
      - window_days
      - line_status
      - item_received
      - linked_claim
      description: One source transaction of the customer. The sentence in description is built from the fact fields
        that follow it; read the fields, not the sentence. A fact that does not apply to the event kind is null, and
        every fact is null for a run scored before contract 1.4.0 (results are written once). The customer's free-text
        reason is never carried.
      properties:
        source_ref: *id001
        event_type: *id001
        observed_at: *id001
        description: *id001
        amount_inr:
          type: number
          nullable: true
        style_id:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        order_id:
          type: string
          nullable: true
          description: The sale order of the line, for a purchase and for a return of that line alike; groups the
            sizes of one style ordered together.
        order_line_no:
          type: integer
          minimum: 1
          nullable: true
        quantity:
          type: integer
          minimum: 0
          nullable: true
          description: Units ordered for a purchase; units requested for return for a return event.
        size:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true
          description: Return events only; a code of the reason codebook.
        reason_group:
          type: string
          nullable: true
          enum:
          - transaction_claim
          - item_complaint
          - fit
          - discretionary
          - null
          description: Return events only; the four groups partition the codebook (reason-groups.yaml).
        day_in_window:
          type: integer
          nullable: true
          description: Return events only; days after delivery at which the request was made.
        window_days:
          type: integer
          minimum: 0
          nullable: true
          description: The line's return window in days.
        line_status:
          type: string
          nullable: true
          description: The sale line's status for a purchase; the return line's status for a return event.
        item_received:
          type: boolean
          nullable: true
          description: Return events only; whether the returned item was received. Null when the reason needs no item back.
        linked_claim:
          type: boolean
          nullable: true
          description: Return events only; a linked account claimed on the same style within 7 days.
