openapi: 3.0.3
info:
  title: ARAI development API
  version: 2.0.0
  description: Local profile has no app authentication. VM reverse proxy requires
    Basic/shared auth for UI and all API routes; 401 may be proxy-generated. Structured
    application errors follow Error; proxy auth response may be plain text.
servers:
- url: /api/v1
paths:
  /auth/dev-users:
    get:
      operationId: listDevUsers
      security: []
      description: Contract 1.16.0 (AM-69). The people of the development login (AUTH_MODE=dev, laptops and demos) with
        their roles. 404 when the instance uses single sign-on.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevUsers'
        '404':
          description: The development login is off on this instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/dev-login:
    post:
      operationId: devLogin
      security: []
      description: Contract 1.16.0 (AM-69). Sign in as a person of the development login. Sets the session cookie
        arai_session (HttpOnly, SameSite=Lax, Secure on the vm profile) and returns the signed-in user with the CSRF
        token every later POST and DELETE must send as X-CSRF-Token. Refused with AUTH_MODE=oidc (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          description: Contract 2.0.0 (AM-71). The person is disabled by an admin (user_disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The development login is off on this instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Not a user of the development login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    get:
      operationId: singleSignOn
      security: []
      description: Contract 1.17.0 (AM-70). Keycloak single sign-on (AUTH_MODE=oidc). Redirects the browser to the realm's
        sign-in page with the authorization code flow, PKCE (S256), a fresh state and a nonce; the attempt is kept for ten
        minutes. 404 with the development login. When Keycloak cannot be reached it redirects to
        /?signin_error=single_sign_on_unavailable instead, so the sign-in page can say so.
      parameters:
      - name: return_to
        in: query
        required: false
        description: A path of this site to come back to after signing in; anything else is replaced by /.
        schema:
          type: string
          maxLength: 500
          default: /
      responses:
        '302':
          description: To Keycloak's sign-in page, or to /?signin_error=single_sign_on_unavailable
        '404':
          description: Single sign-on is off on this instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/callback:
    get:
      operationId: singleSignOnCallback
      security: []
      description: Contract 1.17.0 (AM-70). Keycloak's answer. The state must be one this server issued in the last ten
        minutes and is accepted once; the code is exchanged over the back channel with the client secret and the PKCE
        verifier; the ID token is checked against the realm's published keys (RS256, PS256 or ES256), issuer, audience
        (the client), expiry and the attempt's nonce. Roles come from the token's groups claim through AUTH_ROLE_MAP; a
        person with no ARAI group is refused. Success sets the arai_session cookie and redirects to return_to; a refusal
        redirects to /?signin_error=<code> (sign_in_expired, sign_in_failed, invalid_token, no_role,
        single_sign_on_unavailable; since contract 2.0.0 also user_disabled).
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          maxLength: 4000
      - name: state
        in: query
        required: false
        schema:
          type: string
          maxLength: 500
      - name: error
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      responses:
        '302':
          description: Signed in (to return_to) or refused (to /?signin_error=...)
        '404':
          description: Single sign-on is off on this instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      description: Contract 1.16.0 (AM-69). End the session and clear its cookie. Needs X-CSRF-Token.
      responses:
        '204':
          description: Signed out
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      operationId: getMe
      description: Contract 1.16.0 (AM-69). The signed-in user, roles, permissions, the session's CSRF token and its limits.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users:
    get:
      operationId: listUsers
      description: Contract 2.0.0 (AM-71). Admin only. Everyone who has signed in (at most 1000, by name), with each role
        and where it comes from (keycloak_group, bootstrap, dev), status, open sessions and last activity. Roles are
        read-only in ARAI; they change in Keycloak or the development list and apply at the next sign-in.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin, or a POST without the session's X-CSRF-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{user_id}/disable:
    post:
      operationId: disableUser
      description: Contract 2.0.0 (AM-71). Admin only. Ends every open session of the person now, stops their bearer tokens
        and refuses their next sign-in (403 user_disabled, or /?signin_error=user_disabled) until enabled. Logged with the
        admin and the optional reason. 409 cannot_disable_self for the admin's own account.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin, or a POST without the session's X-CSRF-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An admin cannot disable their own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{user_id}/enable:
    post:
      operationId: enableUser
      description: Contract 2.0.0 (AM-71). Admin only. Lets a disabled person sign in again; sessions ended by the disable stay
        ended. Logged with the admin and the optional reason.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin, or a POST without the session's X-CSRF-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{user_id}/end-sessions:
    post:
      operationId: endUserSessions
      description: Contract 2.0.0 (AM-71). Admin only. Signs the person out everywhere now (they may sign in again, with roles
        read afresh). A bearer token stays valid until it expires; disable the person to stop scripts.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin, or a POST without the session's X-CSRF-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/auth-events:
    get:
      operationId: listAuthEvents
      description: Contract 2.0.0 (AM-71). Admin only. The append-only sign-in log, newest first - sign-ins, sign-outs, ended
        sessions, refused requests, exports, role changes and the admin actions above.
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum: &auth_event_kinds
          - sign_in
          - sign_out
          - session_ended
          - refused
          - export
          - role_change
          - user_disabled
          - user_enabled
          - sessions_ended
      - name: cursor
        in: query
        required: false
        description: The next_cursor of the page before.
        schema:
          type: string
          maxLength: 40
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEventPage'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin, or a POST without the session's X-CSRF-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unknown kind or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /datasets:
    get:
      operationId: listDatasets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: &id007
      - &id002
        name: cursor
        in: query
        required: false
        schema: &id001
          type: string
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
    post:
      operationId: registerDataset
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Identical already registered dataset. A dataset is one snapshot of a world at its cutoff (contract
            1.15.0, AM-68) - another cutoff of the same world is a new dataset (201); the same world and cutoff with other
            content is 409 world_content_differs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - manifest
              - customer_master
              - sku_master
              - reason_code
              - sales_order
              - sales_order_line
              - return_order
              - return_order_line
              properties:
                manifest:
                  type: string
                  description: JSON string validated against bundled manifest.schema.json
                customer_master:
                  type: string
                  format: binary
                sku_master:
                  type: string
                  format: binary
                reason_code:
                  type: string
                  format: binary
                sales_order:
                  type: string
                  format: binary
                sales_order_line:
                  type: string
                  format: binary
                return_order:
                  type: string
                  format: binary
                return_order_line:
                  type: string
                  format: binary
  /datasets/{dataset_id}:
    get:
      operationId: getDataset
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteDataset
      description: Remove a dataset registered by mistake, with its stored files, while no run was scored on it. A dataset
        a run was scored on is kept (409 dataset_in_use), because runs, results and review notes refer to it. Runs and notes
        themselves have no delete.
      responses:
        '204':
          description: Removed
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema: *id001
  /runs:
    post:
      operationId: submitRun
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
    get:
      operationId: listRuns
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id002
      - *id003
      - name: dataset_id
        in: query
        required: false
        schema: *id001
  /runs/{run_id}:
    get:
      operationId: getRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
