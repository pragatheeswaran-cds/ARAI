          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: run_id
        in: path
        required: true
        schema: *id001
  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      description: Stop a run that has not finished. A queued run is interrupted at once; a running run is asked to
        stop and does so at its next stage, leaving no result (results are written only when a run succeeds). A run
        that has finished is a 409 run_finished. Nothing published is touched.
      responses:
        '202':
          description: The run as it now stands (interrupted, or running with the cancel requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: run_id
        in: path
        required: true
        schema: *id001
  /runs/{run_id}/customers:
    get:
      operationId: listCustomers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
