openapi: 3.0.3
info:
  title: ARAI development API
  version: 1.7.0
  description: Local profile has no app authentication. VM reverse proxy requires
    Basic/shared auth for UI and all API routes; 401 may be proxy-generated. Structured
    application errors follow Error; proxy auth response may be plain text.
servers:
- url: /api/v1
paths:
  /datasets:
    get:
      operationId: listDatasets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '401':
          description: VM authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: &id007
      - &id002
        name: cursor
        in: query
        required: false
        schema: &id001
          type: string
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
    post:
      operationId: registerDataset
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          description: VM authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Identical already registered dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - manifest
              - customer_master
              - sku_master
              - reason_code
              - sales_order
              - sales_order_line
              - return_order
              - return_order_line
              properties:
                manifest:
                  type: string
                  description: JSON string validated against bundled manifest.schema.json
                customer_master:
                  type: string
                  format: binary
                sku_master:
                  type: string
                  format: binary
                reason_code:
                  type: string
                  format: binary
                sales_order:
                  type: string
                  format: binary
                sales_order_line:
                  type: string
                  format: binary
                return_order:
                  type: string
                  format: binary
                return_order_line:
                  type: string
                  format: binary
