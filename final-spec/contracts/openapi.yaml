components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: &id009
      - error_code
      - message
      - request_id
      - details
      properties: &id010
        error_code: *id001
        message: *id001
        request_id: *id001
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - rule_id
            - table
            - row_key
            - count
            properties:
              rule_id: *id001
              table:
                type: string
                nullable: true
              row_key:
                type: string
                nullable: true
              count: &id008
                type: integer
                minimum: 0
    Dataset:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - world_id
      - manifest_hash
      - schema_version
      - cutoff
      - history_start
      - purpose
      - validation_status
      - customer_count
      properties:
        dataset_id: *id001
        world_id: *id001
        manifest_hash: *id001
        schema_version:
          type: string
          enum:
          - '1.0'
        cutoff:
          type: string
          format: date-time
        history_start:
          type: string
          format: date
        purpose:
          type: string
          enum:
          - train
          - validation
          - test
          - demo
          - fixture
          - stress
          - external
        validation_status:
          type: string
          enum:
          - accepted
        customer_count: *id008
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - idempotency_key
      properties:
        dataset_id: *id001
        model_id: *id001
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    Run:
      type: object
      additionalProperties: false
      required:
      - run_id
      - dataset_id
      - world_id
      - model_id
      - model_kind
      - status
      - stage
      - progress
      - cutoff
      - created_at
      - completed_at
      - error
      - eligible_count
      - excluded_count
      - selected_count
      - model_only_count
      - baseline_only_count
      - warnings
      - review_budget
      - threshold_score
      - median_score
      - mean_return_rate
      - eligible_requested_units
      - eligible_purchased_units
      - graph_edges
      properties:
        run_id: *id001
        dataset_id: *id001
        world_id: *id001
        model_id: *id001
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - interrupted
        stage: *id001
        progress:
          type: number
          minimum: 0
          maximum: 1
        cutoff:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: object
          additionalProperties: false
          required: *id009
          properties: *id010
          nullable: true
        eligible_count:
          type: integer
          minimum: 0
          nullable: true
        excluded_count:
          type: integer
          minimum: 0
          nullable: true
        selected_count:
          type: integer
          minimum: 0
          nullable: true
        model_only_count:
          type: integer
          minimum: 0
          nullable: true
        baseline_only_count:
          type: integer
          minimum: 0
          nullable: true
        warnings:
          type: array
          items:
            type: string
        review_budget:
          type: integer
          minimum: 0
          nullable: true
          description: The review budget k of this run (the primary budget fraction of the eligible customers, at least
            one). selected_count equals it whenever there are at least k eligible customers. Null until the run succeeded.
        threshold_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: The risk score of the customer at rank k, the last inside the budget; the queue is every eligible
            customer scoring at or above it. Null until the run succeeded or when the budget is zero.
        median_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Median risk score of the eligible customers. The score is a training reference percentile, so a
            snapshot like the training worlds has a median near 50. Null until the run succeeded.
        mean_return_rate:
          type: number
          minimum: 0
          nullable: true
          description: Pooled return rate of the eligible customers on mature sale lines, eligible_requested_units over
            eligible_purchased_units; the run-wide figure a customer's or a group's rate is read against. Null until
            the run succeeded or when no mature unit was purchased.
        eligible_requested_units:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of mature_requested_units over the eligible customers (the numerator of mean_return_rate).
        eligible_purchased_units:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of mature_purchased_units over the eligible customers (the denominator of mean_return_rate).
        graph_edges:
          type: integer
          minimum: 0
          nullable: true
          description: Supported relationship edges found in the snapshot (two or more shared identifier types). Null
            until the run succeeded.
