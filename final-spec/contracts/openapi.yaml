          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curves'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema: *id001
      - name: run_id
        in: query
        required: true
        description: A succeeded run scored on the experiment's demonstration world (the world of the published truth);
          another world is a 409 world_mismatch.
        schema: *id001
      - name: max_points
        in: query
        required: false
        description: At most this many points, thinned evenly over k, always keeping k = 1, the review budget and the last k.
        schema:
          type: integer
          minimum: 2
          maximum: 20000
          default: 200
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          description: Not signed in (no live session; on the vm profile also the proxy's shared login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user's roles do not grant this, or a POST or DELETE lacks the session's X-CSRF-Token (forbidden, csrf_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Resource limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Me:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - email
      - roles
      - permissions
      - auth_mode
      - csrf_token
      - session_expires_at
      - idle_minutes
      - sso_logout_url
      properties:
        user_id: *id001
        display_name: *id001
        email:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - viewer
            - reviewer
            - approver
            - admin
        permissions:
          type: array
          description: read (every screen), export (CSV and case summary), review (notes, open, request approval), decide
            (approve, reject), manage (datasets and runs), administer (people and access, contract 2.0.0). Admin manages
            and does not review.
          items:
            type: string
            enum:
            - read
            - export
            - review
            - decide
            - manage
            - administer
        auth_mode:
          type: string
          enum:
          - dev
          - oidc
        csrf_token:
          type: string
          description: Send as the X-CSRF-Token header on every POST and DELETE of this session. Empty for a request
            authenticated by a bearer token, which needs none.
        session_expires_at:
          type: string
          nullable: true
          format: date-time
          description: The session's maximum age; it also ends after idle_minutes without a request. Null for a request
            authenticated by a bearer token, which has no ARAI session.
        idle_minutes:
          type: integer
          minimum: 1
        sso_logout_url:
          type: string
          nullable: true
          description: Contract 1.17.0 (AM-70). Keycloak's end-session address; the UI goes there after signing out so the
            Keycloak session ends too. Null with the development login.
    DevUsers:
      type: object
      additionalProperties: false
      required:
      - auth_mode
      - users
      properties:
        auth_mode:
          type: string
          enum:
          - dev
        users:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - display_name
            - roles
            properties:
              display_name: *id001
              roles:
                type: array
                items:
                  type: string
    AdminActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: Why, for the sign-in log.
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - email
      - sign_in
      - status
      - roles
      - open_sessions
      - created_at
      - last_sign_in_at
      - last_seen_at
      properties:
        user_id:
          type: string
        display_name:
          type: string
        email:
          type: string
          nullable: true
        sign_in:
          type: string
          enum:
          - keycloak
          - development_login
        status:
          type: string
          enum:
          - active
          - disabled
        roles:
          type: array
          description: Read at the person's last sign-in. keycloak_group is a mapped Keycloak group, bootstrap is
            ARAI_BOOTSTRAP_ADMINS, dev is the development list.
          items:
            type: object
            additionalProperties: false
            required:
            - role
            - source
            properties:
              role:
                type: string
                enum:
                - viewer
                - reviewer
                - approver
                - admin
              source:
                type: string
        open_sessions:
          type: integer
          minimum: 0
          description: Sessions that are neither ended, expired nor idle.
        created_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    AdminUserList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AuthEvent:
      type: object
      additionalProperties: false
      required:
      - event_id
      - at
      - kind
      - user_id
      - display_name
      - request_id
      - detail
      properties:
        event_id:
          type: integer
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum: *auth_event_kinds
        user_id:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        detail:
          type: object
          additionalProperties: true
          description: What happened, by kind (for example reason and path of a refusal, from and to of a role change, by
            and by_name of an admin action). Never a token or a password.
    AuthEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthEvent'
        next_cursor:
          type: string
          nullable: true
    DevLoginRequest:
      type: object
      additionalProperties: false
      required:
      - user
      properties:
        user:
          type: string
          minLength: 1
          maxLength: 100
    Error:
      type: object
      additionalProperties: false
      required: &id009
      - error_code
      - message
      - request_id
      - details
      properties: &id010
        error_code: *id001
        message: *id001
        request_id: *id001
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - rule_id
            - table
            - row_key
            - count
            properties:
              rule_id: *id001
              table:
                type: string
                nullable: true
              row_key:
                type: string
                nullable: true
              count: &id008
                type: integer
                minimum: 0
    Dataset:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - world_id
      - manifest_hash
      - schema_version
      - cutoff
      - history_start
      - purpose
      - validation_status
      - customer_count
      properties:
        dataset_id: *id001
        world_id: *id001
        manifest_hash: *id001
        schema_version:
          type: string
          enum:
          - '1.0'
        cutoff:
          type: string
          format: date-time
        history_start:
          type: string
          format: date
        purpose:
          type: string
          enum:
          - train
          - validation
          - test
          - demo
          - fixture
          - stress
          - external
        validation_status:
          type: string
          enum:
          - accepted
        customer_count: *id008
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - idempotency_key
      properties:
        dataset_id: *id001
        model_id: *id001
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    Run:
      type: object
      additionalProperties: false
      required:
      - run_id
      - previous_snapshot
      - dataset_id
      - world_id
      - model_id
      - model_kind
      - status
      - stage
      - progress
      - cutoff
      - created_at
      - completed_at
      - error
      - eligible_count
      - excluded_count
      - selected_count
      - model_only_count
      - baseline_only_count
      - warnings
      - review_budget
      - threshold_score
      - median_score
      - mean_return_rate
      - eligible_requested_units
      - eligible_purchased_units
      - graph_edges
      - heavy_returner_cutoff
      - community_count
      - ring_count
      - memos
      - stage_log
      - styles_with_verdict
      properties:
        run_id: *id001
        dataset_id: *id001
        world_id: *id001
        model_id: *id001
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - interrupted
        stage: *id001
        progress:
          type: number
          minimum: 0
          maximum: 1
        cutoff:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: object
          additionalProperties: false
          required: *id009
          properties: *id010
          nullable: true
        eligible_count:
          type: integer
          minimum: 0
          nullable: true
        excluded_count:
          type: integer
          minimum: 0
          nullable: true
        selected_count:
          type: integer
          minimum: 0
          nullable: true
        model_only_count:
          type: integer
          minimum: 0
          nullable: true
        baseline_only_count:
          type: integer
          minimum: 0
          nullable: true
        warnings:
          type: array
          items:
            type: string
        review_budget:
          type: integer
          minimum: 0
          nullable: true
          description: The review budget k of this run (the primary budget fraction of the eligible customers, at least
            one). selected_count equals it whenever there are at least k eligible customers. Null until the run succeeded.
        threshold_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: The risk score of the customer at rank k, the last inside the budget; the queue is every eligible
            customer scoring at or above it. Null until the run succeeded or when the budget is zero.
        median_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Median risk score of the eligible customers. The score is a training reference percentile, so a
            snapshot like the training worlds has a median near 50. Null until the run succeeded.
        mean_return_rate:
          type: number
          minimum: 0
          nullable: true
          description: Pooled return rate of the eligible customers on mature sale lines, eligible_requested_units over
            eligible_purchased_units; the run-wide figure a customer's or a group's rate is read against. Null until
            the run succeeded or when no mature unit was purchased.
        eligible_requested_units:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of mature_requested_units over the eligible customers (the numerator of mean_return_rate).
        eligible_purchased_units:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of mature_purchased_units over the eligible customers (the denominator of mean_return_rate).
        graph_edges:
          type: integer
          minimum: 0
          nullable: true
          description: Supported relationship edges found in the snapshot (two or more shared identifier types). Null
            until the run succeeded.
        heavy_returner_cutoff:
          type: number
          minimum: 0
          nullable: true
          description: The raw return rate at the 90th percentile of this run's eligible customers (linear interpolation),
            the gate's own definition of a heavy returner. A customer at or above it who is not selected for review is a
            cleared heavy returner. Null until the run succeeded.
        community_count:
          type: integer
          minimum: 0
          nullable: true
          description: Groups of linked accounts in the snapshot, the connected components of the supported edges (a
            component of thirteen or more members is split by Louvain with a fixed seed). Null until the run succeeded.
        ring_count:
          type: integer
          minimum: 0
          nullable: true
          description: Of community_count, the groups the stated rule calls a ring (see Customer.community.kind; contract
            1.14.0 asks more of groups whose edges share only an address and a device). Evidence about the group, not a
            verdict on any member. Null until the run succeeded.
        memos:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - selected
          - ok
          - unavailable
          - complete
          description: How far the run's investigation memos are. They are drafted after the run succeeded, one per selected
            customer, so results are served while they arrive; complete when every selected customer has a decided memo
            (ok or unavailable). Null until the run succeeded.
          properties:
            selected: *id008
            ok: *id008
            unavailable: *id008
            complete:
              type: boolean
        stage_log:
          type: array
          description: When each stage began, in order, from validate on; the stepper derives elapsed times from consecutive
            entries and completed_at. Empty for a queued run and for runs scored before contract 1.12.0.
          items:
            type: object
            additionalProperties: false
            required:
            - stage
            - at
            properties:
              stage: *id001
              at:
                type: string
                format: date-time
        styles_with_verdict:
          type: integer
          minimum: 0
          nullable: true
          description: Styles whose state is quality, targeting or mixed_or_uncertain, for the done summary. Null until the run
            succeeded.
        refunds:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - review_set
          - rule_set
          description: Contract 1.14.0. Refunds paid to the customers of the review set and to the customers the return-rate
            rule would select, from the run's stored timeline, for the Overview. Observed money, not losses. Null until the
            run succeeded, and for a run scored before return-line statuses were stored.
          properties:
            review_set:
              $ref: '#/components/schemas/RefundTotals'
            rule_set:
              $ref: '#/components/schemas/RefundTotals'
        previous_snapshot:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - dataset_id
          - run_id
          - cutoff
          - repeat
          - new
          - left
          - approved_before
          - rejected_before
          description: Contract 1.15.0 (AM-68). This run's review set against the previous snapshot of the same world (the
            latest earlier cutoff with a succeeded run, read from its latest succeeded run) - customers in both review sets,
            new to this one, gone from it, and how many of this review set had their review end in approve or reject on an
            earlier snapshot. Null until the run succeeded and on a world's first scored snapshot.
          properties:
            dataset_id: *id001
            run_id: *id001
            cutoff:
              type: string
              format: date-time
            repeat:
              type: integer
              minimum: 0
            new:
              type: integer
              minimum: 0
            left:
              type: integer
              minimum: 0
            approved_before:
              type: integer
              minimum: 0
            rejected_before:
              type: integer
              minimum: 0
    RefundTotals:
      type: object
      additionalProperties: false
      required:
      - customers
      - refunded_inr
      - claim_refunded_inr
      properties:
        customers:
          type: integer
          minimum: 0
        refunded_inr:
          type: number
          minimum: 0
          description: Refunds paid on return lines whose status is refunded, in INR.
        claim_refunded_inr:
          type: number
          minimum: 0
          description: The part paid on transaction-claim lines.
    Support:
      type: object
      additionalProperties: false
      required:
      - mature_sale_lines
      - mature_purchased_units
      - mature_requested_units
      - all_requested_units
      properties:
        mature_sale_lines: *id008
        mature_purchased_units: *id008
        mature_requested_units: *id008
        all_requested_units: *id008
    Signal:
      type: object
      additionalProperties: false
      required:
      - code
      - label
      - value
      - denominator
      - unit
      - source_refs
      properties:
        code: *id001
        label: *id001
        value:
          type: number
          nullable: true
        denominator:
          type: number
          nullable: true
        unit: *id001
        source_refs:
          type: array
          items: *id001
    Customer:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - previous
      - earlier_decision
      - eligibility_status
      - raw_score
      - risk_score
      - rank
      - selected_for_review
      - baseline_rank
      - baseline_selected
      - support_counts
      - evidence_tags
      - wardrobing_status
      - latest_disposition
      - basket_expectation
      - cleared_reason
      - community
      - tier
      - gate_outcome
      - primary_signals
      - workflow
      properties:
        customer_id: *id001
        eligibility_status:
          type: string
          enum:
          - eligible
          - insufficient_history
        raw_score:
          type: number
          nullable: true
        risk_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        rank:
          type: integer
          minimum: 1
          nullable: true
        selected_for_review: &id011
          type: boolean
        baseline_rank:
          type: integer
          minimum: 1
          nullable: true
        baseline_selected:
          type: boolean
        support_counts:
          $ref: '#/components/schemas/Support'
        evidence_tags:
          type: array
          items: *id001
        wardrobing_status:
          type: string
          enum:
          - elevated
          - possible
          - no_elevated_signal
          - insufficient_evidence
          - incomplete
        latest_disposition:
          type: string
          enum:
          - needs_investigation
          - likely_legitimate
          - unresolved
          - null
          nullable: true
        refunded_inr:
          type: number
          minimum: 0
          nullable: true
          description: Contract 1.14.0. Refunds paid on this customer's return lines whose status is refunded, in INR, from
            the run's stored timeline. Observed money, not a loss and not proof of anything; rejected and withdrawn
            requests carry none. Null for a run scored before return-line statuses were stored.
        claim_refunded_inr:
          type: number
          minimum: 0
          nullable: true
          description: Contract 1.14.0. The part of refunded_inr paid on transaction-claim lines (item not received, empty
            package, missing parts, wrong item sent), where no item comes back to inspect.
        absent_signals:
          type: array
          nullable: true
          items:
            type: string
            enum:
            - repeat_claims
            - linked_claims
            - late_returns
            - returns_above_expected
            - supported_links
          description: Contract 1.14.0. For an eligible customer outside the review set, the evidence tags the customer
            does not carry, so the cleared view can say what was not observed. Null for a selected or unranked customer.
        previous:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - cutoff
          - run_id
          - present
          - rank
          - risk_score
          - selected_for_review
          - workflow_state
          description: Contract 1.15.0 (AM-68). The same customer in the previous snapshot of its world - absent (present
            false, an account that did not exist yet) or its rank, score, place in that review set and where its review
            ended there (null with no workflow event). Null when the run has no previous snapshot.
          properties:
            cutoff:
              type: string
              format: date-time
            run_id: *id001
            present:
              type: boolean
            rank:
              type: integer
              nullable: true
            risk_score:
              type: number
              nullable: true
            selected_for_review:
              type: boolean
              nullable: true
            workflow_state:
              type: string
              nullable: true
              enum:
              - in_review
              - awaiting_approval
              - approved
              - rejected
              - null
        earlier_decision:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - state
          - decided_by
          - decided_at
          - cutoff
          description: Contract 1.15.0 (AM-68). The latest earlier snapshot of the world on which this customer's review
            ended in a decision, with who decided and when. The workflow runs per snapshot, so a decision there does not
            decide this snapshot's case. Null without one.
          properties:
            state:
              type: string
              enum:
              - approved
              - rejected
            decided_by: *id001
            decided_at:
              type: string
              format: date-time
            cutoff:
              type: string
              format: date-time
        basket_expectation:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - actual_units
          - purchased_units
          - expected_units
          - sd
          - band_low
          - band_high
          - z
          description: Units requested for return on mature sale lines against the units a customer buying the same products
            would be expected to request, with the normal band expected +/- 2 sd, sd = sqrt(d * sum q p (1 - p)) over the
            lines with d the mean lines per order and style clipped to [1, 4]. The same quantities the model's expected
            return rate and residual z are built from; nothing is recomputed. sd, the band and z are null when every line's
            expected probability is 0 or 1, and for runs scored before contract 1.5.0.
          properties:
            actual_units: *id008
            purchased_units: *id008
            expected_units:
              type: number
              minimum: 0
            sd:
              type: number
              minimum: 0
              nullable: true
            band_low:
              type: number
              minimum: 0
              nullable: true
            band_high:
              type: number
              minimum: 0
              nullable: true
            z:
              type: number
              nullable: true
        cleared_reason:
          type: string
          nullable: true
          enum:
          - size_bracketing
          - high_return_styles
          - as_basket_predicts
          - below_threshold
          - null
          description: Why an eligible customer outside the review queue is not in it, as a template key the UI renders
            in one line; the first rule that holds of size_bracketing (half or more of mature units bought as several
            sizes of one style), high_return_styles (expected return rate of the basket .35 or more), as_basket_predicts
            (residual z below 1), else below_threshold. Null for customers in the queue and for unranked customers. A
            template, never generated text.
        community:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - id
          - kind
          - size
          description: The group of linked accounts this customer belongs to (a connected component of the supported
            edges), with its observable kind. Null for a customer with no supported edge, and for runs scored before
            contract 1.6.0. Membership of a group is evidence about the relationship, not guilt.
          properties:
            id: *id001
            kind: &id012
              type: string
              enum:
              - ring
              - household
              description: From observed evidence only (decision D3, revised by AM-66 in contract 1.14.0). Where some
                edge of the group shares a payment instrument - ring when any edge has a coordinated claim match (both
                accounts claimed on the same style within 7 days), or two or more members are selected for review, or a
                member has a coordinated claim share above zero. Where every edge shares only an address and a device
                (the shape of a household) - ring only with two or more coordinated claim matches or two or more members
                selected for review. household otherwise. Runs scored before 1.14.0 keep the kinds they were scored with.
            size:
              type: integer
              minimum: 2
        tier:
          type: string
          nullable: true
          enum:
          - HIGH
          - MEDIUM
          - LOW
          - null
          description: Anchored to the queue, not to fixed percentiles (the score is a training reference percentile, so
            fixed bands would put a quarter of customers in the top band). HIGH is selected for review; MEDIUM scores
            90 or above and is not selected; LOW is every other eligible customer. Null for a customer without a score.
        gate_outcome:
          type: string
          nullable: true
          enum:
          - ESCALATE
          - HOLD
          - WARNING
          - LOW
          - null
          description: A presentation rule over stored results, not a model output, and the UI says so. ESCALATE is
            selected and either in a ring or with the wardrobing indicator elevated; HOLD is selected otherwise;
            WARNING is not selected and either MEDIUM or at or above the run's heavy_returner_cutoff; LOW is every
            other eligible customer. Null for a customer without a score.
        primary_signals:
          type: array
          maxItems: 3
          description: Up to three of the customer's evidence_tags, in the order the score breakdown ranks their families
            (the family whose typical values lower the score most comes first; a tag with no family comes last), each
            as a plain phrase under 40 characters with the value and denominator of the signal behind it. Nothing new is
            measured; the tags are unchanged.
          items:
            type: object
            additionalProperties: false
            required:
            - tag
            - label
            - family
            - value
            - denominator
            - unit
            properties:
              tag: *id001
              label: *id001
              family:
                type: string
                nullable: true
                enum:
                - claims
                - timing
                - expected_vs_actual
                - composition
                - volume
                - null
              value:
                type: number
                nullable: true
              denominator:
                type: number
                nullable: true
              unit: *id001
        workflow:
          type: object
          additionalProperties: false
          required:
          - state
          - opened_by
          - opened_by_user_id
          - opened_at
          - decided_by
          - decided_at
          description: Where the case stands in the review workflow, derived on read from the customer's reviews in this
            snapshot of its world (per snapshot since contract 1.15.0, AM-68) and never stored. The latest open,
            request_approval, approve or reject decides the state; with no such event a customer the gate leaves at LOW or WARNING is auto_logged (no reviewer is needed, and it is still in
            the log) and every other customer is new. A note or feedback never moves the state. opened_by names the
            reviewer of the latest open; the server refuses an approve or reject by that reviewer (409
            second_reviewer_required).
          properties:
            state:
              type: string
              enum:
              - new
              - in_review
              - awaiting_approval
              - approved
              - rejected
              - auto_logged
            opened_by:
              type: string
              nullable: true
            opened_by_user_id:
              type: string
              nullable: true
              description: Contract 1.16.0. The user who made the latest open; null for an open written before sign-in
                existed. The UI compares it with the signed-in user to tell a reviewer they cannot decide their own case.
            opened_at:
              type: string
              format: date-time
              nullable: true
            decided_by:
              type: string
              nullable: true
              description: The reviewer of the approve or reject that is the latest workflow event; null otherwise.
            decided_at:
              type: string
              format: date-time
              nullable: true
    ReviewRequest:
      type: object
      additionalProperties: false
      description: Contract 2.0.0 (AM-71) removed reviewer_name (ignored since 1.16.0); a body that carries it is a 422. The
        author is the signed-in user.
      required:
      - disposition
      - note
      - idempotency_key
      properties:
        kind:
          type: string
          default: note
          enum:
          - note
          - open
          - request_approval
          - approve
          - reject
          - feedback
          description: What the review does. note (the default) and feedback record an opinion and never move the
            workflow; open takes the case into review; request_approval asks for a second person; approve and reject
            decide it. The rules, checked under one lock per customer - open needs a case that is not open (409
            case_already_open while it is in review or awaiting approval); request_approval, approve and reject need an
            open case (409 case_not_open) that is not yet decided (409 case_decided; reopen first), and approval cannot be
            requested twice (409 case_already_open); approve and reject by the reviewer who made the latest open are
            refused (409 second_reviewer_required) with a fixed message the UI shows as it is, names compared without
            regard to case or spacing; the four workflow kinds apply only to a customer selected for review and feedback
            only to the others (409 out_of_scope). approve and reject carry a reading, needs_investigation or
            likely_legitimate (422 request.decision_disposition). Every kind needs a note, and no text may hold a NUL byte.
        disposition:
          type: string
          enum:
          - needs_investigation
          - likely_legitimate
          - unresolved
        note:
          type: string
          minLength: 1
          maxLength: 4000
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    Review:
      type: object
      additionalProperties: false
      required:
      - review_id
      - world_id
      - customer_id
      - run_id
      - model_id
      - reviewer_name
      - kind
      - disposition
      - note
      - created_at
      - dataset_id
      - snapshot_cutoff
      - author
      properties:
        review_id: *id001
        world_id: *id001
        customer_id: *id001
        run_id: *id001
        model_id: *id001
        reviewer_name: *id001
        kind:
          type: string
          enum:
          - note
          - open
          - request_approval
          - approve
          - reject
          - feedback
          description: Rows written before contract 1.8.0 are notes.
        disposition:
          type: string
          enum:
          - needs_investigation
          - likely_legitimate
          - unresolved
        note: *id001
        created_at:
          type: string
          format: date-time
        dataset_id:
          type: string
          description: Contract 1.15.0 (AM-68). The snapshot the note was written on. Notes follow the customer across the
            snapshots of its world; open, approval and decision events count only in their own snapshot.
        snapshot_cutoff:
          type: string
          format: date-time
          description: Contract 1.15.0. The cutoff of that snapshot.
        author:
          type: object
          additionalProperties: false
          required:
          - user_id
          - display_name
          - verified
          description: Contract 1.16.0 (AM-69). Who wrote it. verified is true for a review written by a signed-in user,
            whose display name the server recorded; false for a review written before sign-in existed, whose name was
            typed and never checked (user_id null).
          properties:
            user_id:
              type: string
              nullable: true
            display_name:
              type: string
            verified:
              type: boolean
    TimelineEvent:
      type: object
      additionalProperties: false
      required:
      - source_ref
      - event_type
      - observed_at
      - description
      - amount_inr
      - style_id
      - sku
      - order_id
      - order_line_no
      - quantity
      - size
      - reason_code
      - reason_group
      - day_in_window
      - window_days
      - line_status
      - item_received
      - linked_claim
      description: One source transaction of the customer. The sentence in description is built from the fact fields
        that follow it; read the fields, not the sentence. A fact that does not apply to the event kind is null, and
        every fact is null for a run scored before contract 1.4.0 (results are written once). The customer's free-text
        reason is never carried.
      properties:
        source_ref: *id001
        event_type: *id001
        observed_at:
          type: string
          description: When the event happened - an ISO date (the order date) for a purchase, an ISO date-time with offset
            (the request time) for a return_request. Order the timeline by this field as text.
        description: *id001
        amount_inr:
          type: number
          nullable: true
        style_id:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        order_id:
          type: string
          nullable: true
          description: The sale order of the line, for a purchase and for a return of that line alike; groups the
            sizes of one style ordered together.
        order_line_no:
          type: integer
          minimum: 1
          nullable: true
        quantity:
          type: integer
          minimum: 0
          nullable: true
          description: Units ordered for a purchase; units requested for return for a return event.
        size:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true
          description: Return events only; a code of the reason codebook.
        reason_group:
          type: string
          nullable: true
          enum:
          - transaction_claim
          - item_complaint
          - fit
          - discretionary
          - null
          description: Return events only; the four groups partition the codebook (reason-groups.yaml).
        day_in_window:
          type: integer
          nullable: true
          description: Return events only; days after delivery at which the request was made.
        window_days:
          type: integer
          minimum: 0
          nullable: true
          description: The line's return window in days.
        line_status:
          type: string
          nullable: true
          description: The sale line's status for a purchase; the return line's status for a return event.
        item_received:
          type: boolean
          nullable: true
          description: Return events only; whether the returned item was received. Null when the reason needs no item back.
        linked_claim:
          type: boolean
          nullable: true
          description: Return events only; a linked account claimed on the same style within 7 days.
    Neighbor:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - shared_types
      - shared_value_count
      - supported
      - max_value_fanout
      - coordinated_claim_matches
      - risk_score
      - rank
      - selected_for_review
      - evidence_tags
      properties:
        customer_id: *id001
        shared_types:
          type: array
          items:
            type: string
            enum:
            - address
            - device
            - payment
        shared_value_count: *id008
        supported: *id011
        max_value_fanout: *id008
        coordinated_claim_matches: *id008
        risk_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: The neighbour's own risk score in this run (null if the neighbour is not eligible). A link is
            evidence about the relationship; this score says nothing about the customer whose case is shown.
        rank:
          type: integer
          minimum: 1
          nullable: true
        selected_for_review: *id011
        evidence_tags:
          type: array
          items:
            type: string
    Wardrobing:
      type: object
      additionalProperties: false
      required:
      - status
      - indicator_score
      - signals
      - limitation
      properties:
        status:
          type: string
          enum:
          - elevated
          - possible
          - no_elevated_signal
          - insufficient_evidence
          - incomplete
        indicator_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
        limitation: *id001
    Style:
      type: object
      additionalProperties: false
      required:
      - style_id
      - category
      - state
      - mature_sale_lines
      - purchased_units
      - requested_units
      - unique_returners
      - raw_return_rate
      - shrunk_return_rate
      - damage_share
      - claim_share
      - linked_claim_share
      - linked_claimers
      - quality_signal
      - targeting_signal
      - name
      - median_return_day
      - share_in_last_five_days
      - flagged_returner_share
      - ring_returners
      - median_returner_score
      - reason_codes
      properties:
        style_id: *id001
        category: *id001
        name:
          type: string
          description: '"{brand} {category}" from sku_master, which has no name column, with the style id appended when
            that pair is not unique in the run; the style id alone for runs scored before contract 1.9.0.'
        median_return_day:
          type: number
          minimum: 0
          nullable: true
          description: Median day after delivery of the style's return requests on mature lines. Null without a timed
            request and for runs scored before 1.9.0.
        share_in_last_five_days:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: Share of the style's timed requests made in the last five days of the return window.
        flagged_returner_share:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - numerator
          - denominator
          - share
          description: Of the customers with a request on the style's mature lines (unique_returners), how many are selected
            for review in this run. A share of returners, not a statement about the product.
          properties:
            numerator: *id008
            denominator: *id008
            share:
              type: number
              minimum: 0
              maximum: 1
              nullable: true
        ring_returners:
          type: integer
          minimum: 0
          nullable: true
          description: Returners whose group of linked accounts the stated rule calls a ring.
        median_returner_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Median risk score of the eligible returners, to read against the run's median_score.
        reason_codes:
          type: array
          description: The style's return requests on mature lines by reason code, most units first; the units sum to
            requested_units. From the codebook, never the customer's free text. Empty for runs scored before 1.9.0.
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - group
            - lines
            - units
            properties:
              code: *id001
              group:
                type: string
                enum:
                - transaction_claim
                - item_complaint
                - fit
                - discretionary
              lines: *id008
              units: *id008
        state:
          type: string
          enum:
          - quality
          - targeting
          - mixed_or_uncertain
          - no_elevated_signal
          - insufficient_support
          - no_return_evidence
        mature_sale_lines: *id008
        purchased_units: *id008
        requested_units: *id008
        unique_returners: *id008
        raw_return_rate:
          type: number
          nullable: true
        shrunk_return_rate:
          type: number
          nullable: true
        damage_share:
          type: number
          nullable: true
        claim_share:
          type: number
          nullable: true
        linked_claim_share:
          type: number
          nullable: true
        linked_claimers: *id008
        quality_signal: *id011
        targeting_signal: *id011
    Sku:
      type: object
      additionalProperties: false
      required:
      - sku
      - style_id
      - size
      - colour
      - unit_price_inr
      - mature_sale_lines
      - purchased_units
      - requested_units
      - support_status
      properties:
        sku: *id001
        style_id: *id001
        size: *id001
        colour: *id001
        unit_price_inr:
          type: number
        mature_sale_lines: *id008
        purchased_units: *id008
        requested_units: *id008
        support_status:
          type: string
          enum:
          - supported
          - insufficient_support
          - no_return_evidence
    CommunityMember:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - risk_score
      - rank
      - selected_for_review
      - eligibility_status
      - mature_requested_units
      - mature_purchased_units
      - evidence_tags
      description: A member of the community with its own result in this run. The score is the member's, and says
        nothing about the customer whose case is shown.
      properties:
        customer_id: *id001
        risk_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        rank:
          type: integer
          minimum: 1
          nullable: true
        selected_for_review: *id011
        eligibility_status:
          type: string
          enum:
          - eligible
          - insufficient_history
        mature_requested_units: *id008
        mature_purchased_units: *id008
        evidence_tags:
          type: array
          items: *id001
    CommunityEdge:
      type: object
      additionalProperties: false
      required:
      - a
      - b
      - types
      - coordinated_claim_matches
      description: A supported edge between two members (a sorts before b), the identifier types shared, and how many
        claim lines of either account the other matched on the same style within 7 days (the larger of the two
        directions).
      properties:
        a: *id001
        b: *id001
        types:
          type: array
          items:
            type: string
            enum:
            - address
            - device
            - payment
        coordinated_claim_matches: *id008
    Case:
      type: object
      additionalProperties: false
      required:
      - run_id
      - dataset_id
      - world_id
      - model_id
      - model_kind
      - cutoff
      - customer
      - signals
      - timeline
      - neighbors
      - styles
      - wardrobing
      - community
      - score_breakdown
      - rules_fired
      - memo
      - reviews
      - history
      properties:
        run_id: *id001
        dataset_id: *id001
        world_id: *id001
        model_id: *id001
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
        cutoff: *id001
        customer:
          $ref: '#/components/schemas/Customer'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        neighbors:
          type: array
          items:
            $ref: '#/components/schemas/Neighbor'
        styles:
          type: array
          items:
            $ref: '#/components/schemas/Style'
        wardrobing:
          $ref: '#/components/schemas/Wardrobing'
        community:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - id
          - kind
          - method
          - size
          - selected_count
          - requested_units
          - purchased_units
          - coordinated_claim_matches
          - members
          - edges
          description: The customer's group of linked accounts with every member's own result and the edges between
            members, so the group can be drawn and its captions derived (requested_units over purchased_units is the
            group's return rate on mature lines; a member's rate is read against the run's mean_return_rate). Null for
            a customer with no supported edge, and for runs scored before contract 1.6.0.
          properties:
            id: *id001
            kind: *id012
            method:
              type: string
              enum:
              - components
              - louvain
              description: components when the group is a whole connected component of the supported edges; louvain
                when it is one part of a component of thirteen or more members, split on the edge weight with a fixed
                seed.
            size:
              type: integer
              minimum: 2
            selected_count: *id008
            requested_units: *id008
            purchased_units: *id008
            coordinated_claim_matches: *id008
            members:
              type: array
              items:
                $ref: '#/components/schemas/CommunityMember'
            edges:
              type: array
              items:
                $ref: '#/components/schemas/CommunityEdge'
        score_breakdown:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - method
          - typical_from
          - threshold_raw_score
          - families
          description: The score the frozen pipeline gives when one feature family sits at typical values and everything
            else stays as observed, for each of the five families that partition the 43 model features. The honest
            reading is "the score with this family at typical values"; boosted trees do not decompose additively, so
            these are never contributions that sum to the score. Each row is also the counterfactual for that family
            removed. Predict-side only; nothing is fitted and no selection changes. Null for a customer without a score
            and for runs scored before contract 1.7.0.
          properties:
            method:
              type: string
              enum:
              - family_at_typical_values
            typical_from:
              type: string
              nullable: true
              enum:
              - training
              - snapshot
              - null
              description: Whose medians stood in for a family's features. training is the bundle's frozen training
                median (the normal case); snapshot is the median of this run's eligible customers, used only when a
                bundle carries no feature quantiles.
            threshold_raw_score:
              type: number
              nullable: true
              description: The pipeline's raw score of the customer at rank k, the queue's edge; in_queue_without compares
                against it. Null when the budget is zero.
            families:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - family
                - label
                - feature_count
                - raw_score_without
                - score_without
                - delta_points
                - in_queue_without
                - tier_without
                properties:
                  family:
                    type: string
                    enum:
                    - claims
                    - timing
                    - expected_vs_actual
                    - composition
                    - volume
                  label: *id001
                  feature_count:
                    type: integer
                    minimum: 0
                    description: How many of the family's features this run's bundle reads; 0 for a family the baseline
                      fallback does not read (it scores on raw_return_rate alone).
                  raw_score_without:
                    type: number
                  score_without:
                    type: number
                    minimum: 0
                    maximum: 100
                  delta_points:
                    type: number
                    description: score_without minus the customer's risk_score; negative when the family raises the score.
                  in_queue_without:
                    type: boolean
                    description: Whether raw_score_without is at or above threshold_raw_score, everyone else unchanged.
                  tier_without:
                    type: string
                    enum:
                    - HIGH
                    - MEDIUM
                    - LOW
                    description: The tier rule applied to the re-scored customer, in_queue_without standing for selected.
        rules_fired:
          type: array
          description: The analyst rulebook's five rules as they stand for this customer, shown as rules that would have
            fired. Report-only; they are not part of the score. fired is null when the rule's training threshold is not
            in the bundle, an input is missing, or the run predates contract 1.7.0.
          items:
            type: object
            additionalProperties: false
            required:
            - rule_id
            - label
            - fired
            properties:
              rule_id:
                type: string
                enum:
                - rate_p90
                - claims_2
                - refund_ratio_p90
                - linked_claimant
                - late_half
              label: *id001
              fired:
                type: boolean
                nullable: true
        memo:
          type: object
          additionalProperties: false
          required:
          - status
          - summary
          - key_evidence
          - alternative_explanations
          - recommended_action
          - attempts
          - reason
          - model
          - generated_at
          description: The investigation memo drafted for a selected customer from this case alone (no free text, no private
            truth, no other customer's identifier), after a deterministic gate in which every number it cites is a value or denominator
            of the case, every panel exists, the action is a gate outcome, no other customer is named, the sections are short.
            A failed draft is retried once; two failures give unavailable with the reason. The UI shows memo content only when
            status is ok. A memo is a draft for a reviewer, never a decision; it changes no score, rank or selection.
          properties:
            status:
              type: string
              enum:
              - ok
              - unavailable
              - pending
              - not_selected
              description: pending while the run's memos are still being drafted; not_selected for a customer outside the queue;
                unavailable with reason no_api_key when the deployment has no key (by design, every memo is unavailable then).
            summary:
              type: string
              nullable: true
            key_evidence:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - statement
                - panel
                - value
                - denominator
                properties:
                  statement: *id001
                  panel:
                    type: string
                    enum:
                    - expected
                    - returns
                    - linked
                    - wardrobing
                  value:
                    type: number
                  denominator:
                    type: number
                    nullable: true
            alternative_explanations:
              type: array
              items: *id001
            recommended_action:
              type: string
              nullable: true
              enum:
              - ESCALATE
              - HOLD
              - WARNING
              - LOW
              - null
            attempts: *id008
            reason:
              type: string
              nullable: true
            model:
              type: string
              nullable: true
            generated_at:
              type: string
              format: date-time
              nullable: true
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          description: Every note on this customer in any snapshot of its world, oldest first.
        history:
          type: array
          description: Contract 1.15.0 (AM-68). The customer in every scored snapshot of its world, oldest cutoff first, each
            read from that snapshot's stored results (this run for this run's snapshot, otherwise the snapshot's latest
            succeeded run). Nothing is recomputed or carried from one snapshot to another.
          items:
            $ref: '#/components/schemas/HistoryEntry'
    HistoryEntry:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - cutoff
      - run_id
      - model_kind
      - current
      - present
      - eligibility_status
      - rank
      - risk_score
      - tier
      - gate_outcome
      - selected_for_review
      - mature_requested_units
      - mature_purchased_units
      - refunded_inr
      - evidence_tags
      - community_kind
      - workflow
      - notes
      properties:
        dataset_id: *id001
        cutoff:
          type: string
          format: date-time
        run_id: *id001
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
        current:
          type: boolean
          description: True for the snapshot of the run being viewed.
        present:
          type: boolean
          description: False when the account did not exist yet at that cutoff; every other value is then null or empty.
        eligibility_status:
          type: string
          nullable: true
          enum:
          - eligible
          - insufficient_history
          - null
        rank:
          type: integer
          nullable: true
        risk_score:
          type: number
          nullable: true
        tier:
          type: string
          nullable: true
          enum:
          - HIGH
          - MEDIUM
          - LOW
          - null
        gate_outcome:
          type: string
          nullable: true
          enum:
          - ESCALATE
          - HOLD
          - WARNING
          - LOW
          - null
        selected_for_review:
          type: boolean
          nullable: true
        mature_requested_units:
          type: integer
          nullable: true
        mature_purchased_units:
          type: integer
          nullable: true
        refunded_inr:
          type: number
          nullable: true
        evidence_tags:
          type: array
          items:
            type: string
        community_kind:
          type: string
          nullable: true
          enum:
          - ring
          - household
          - null
        workflow:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - state
          - opened_by
          - opened_by_user_id
          - opened_at
          - decided_by
          - decided_at
          description: Where the case stands in the review workflow, derived on read from the customer's reviews in this
            snapshot of its world (per snapshot since contract 1.15.0, AM-68) and never stored. The latest open,
            request_approval, approve or reject decides the state; with no such event a customer the gate leaves at LOW or WARNING is auto_logged (no reviewer is needed, and it is still in
            the log) and every other customer is new. A note or feedback never moves the state. opened_by names the
            reviewer of the latest open; the server refuses an approve or reject by that reviewer (409
            second_reviewer_required).
          properties:
            state:
              type: string
              enum:
              - new
              - in_review
              - awaiting_approval
              - approved
              - rejected
              - auto_logged
            opened_by:
              type: string
              nullable: true
            opened_by_user_id:
              type: string
              nullable: true
              description: Contract 1.16.0. The user who made the latest open; null for an open written before sign-in
                existed. The UI compares it with the signed-in user to tell a reviewer they cannot decide their own case.
            opened_at:
              type: string
              format: date-time
              nullable: true
            decided_by:
              type: string
              nullable: true
              description: The reviewer of the approve or reject that is the latest workflow event; null otherwise.
            decided_at:
              type: string
              format: date-time
              nullable: true
        notes:
          type: integer
          minimum: 0
          description: Notes written on that snapshot.
    StyleDetail:
      type: object
      additionalProperties: false
      required:
      - run_id
      - style
      - skus
      - customer_ids
      - returners
      - signals
      properties:
        run_id: *id001
        style:
          $ref: '#/components/schemas/Style'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/Sku'
        customer_ids:
          type: array
          items: *id001
          description: The returners' ids in the same order as returners.
        returners:
          type: array
          description: Customers with a request on the style, those with linked claims first, each with its own result in
            the run. A customer's score is the customer's; the style's state is the style's.
          items:
            type: object
            additionalProperties: false
            required:
            - customer_id
            - risk_score
            - rank
            - selected_for_review
            - tier
            - community
            - requested_units
            - claim_lines
            - linked_claim_lines
            - return_lines
            - purchased_lines
            - last_reason_code
            properties:
              customer_id: *id001
              risk_score:
                type: number
                minimum: 0
                maximum: 100
                nullable: true
              rank:
                type: integer
                minimum: 1
                nullable: true
              selected_for_review: *id011
              tier:
                type: string
                nullable: true
                enum:
                - HIGH
                - MEDIUM
                - LOW
                - null
              community:
                type: object
                nullable: true
                additionalProperties: false
                required:
                - id
                - kind
                - size
                properties:
                  id: *id001
                  kind: *id012
                  size:
                    type: integer
                    minimum: 2
              requested_units: *id008
              claim_lines: *id008
              linked_claim_lines: *id008
              return_lines:
                type: integer
                minimum: 0
                nullable: true
              purchased_lines:
                type: integer
                minimum: 0
                nullable: true
              last_reason_code:
                type: string
                nullable: true
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
    Metric:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      - numerator
      - denominator
      - lower_95
      - upper_95
      - scope
      - code
      - ranking
      - slice
      properties:
        code:
          type: string
          nullable: true
          description: Stable identifier of what is measured (for example precision, review_rate.benign_household). Clients
            select metrics by code, ranking and slice; name and scope are display text and may be reworded.
        ranking:
          type: string
          nullable: true
          description: The ranking the metric belongs to (raw_return_rate, a candidate or a reference), when it belongs to one.
        slice:
          type: string
          nullable: true
          description: Where it was measured (validation, test, dry_run, world:<id>, budget:<fraction>, ablation, calibration,
            honest_groups, stress:<id>).
        name: *id001
        value:
          type: number
          nullable: true
        numerator:
          type: number
          nullable: true
        denominator:
          type: number
          nullable: true
        lower_95:
          type: number
          nullable: true
        upper_95:
          type: number
          nullable: true
        scope: *id001
    Candidate:
      type: object
      additionalProperties: false
      required:
      - candidate_id
      - ordinal
      - status
      - reasons
      - metrics
      properties:
        candidate_id: *id001
        ordinal: *id008
        status:
          type: string
          enum:
          - passed
          - rejected
          - error
          - not_evaluated
        reasons:
          type: array
          items: *id001
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
    ExperimentSummary:
      type: object
      additionalProperties: false
      required:
      - experiment_id
      - config_hash
      - selection_status
      - selected_model_id
      - selected_candidate_id
      - final_test_status
      - git_sha
      - train_seeds
      - validation_seeds
      - test_seeds
      - demo_seeds
      - stress_seeds
      properties:
        experiment_id: *id001
        config_hash: *id001
        git_sha:
          type: string
          nullable: true
          description: The commit of the code that published the experiment, which publishing verified still reproduces
            the frozen training features. Null when published outside a repository or before contract 1.10.0.
        train_seeds: &id013
          type: array
          description: World seeds experiment.yaml fixes; empty for reports published before contract 1.10.0.
          items:
            type: integer
        validation_seeds: *id013
        test_seeds: *id013
        demo_seeds: *id013
        stress_seeds: *id013
        selection_status:
          type: string
          enum:
          - not_completed
          - selected
          - no_selected_model
        selected_model_id:
          type: string
          nullable: true
        selected_candidate_id:
          type: string
          nullable: true
        final_test_status:
          type: string
          enum:
          - not_run
          - passed
          - failed
          - unverifiable
    Experiment:
      type: object
      additionalProperties: false
      required:
      - summary
      - synthetic_only
      - baseline_metrics
      - candidates
      - per_world_metrics
      - sensitivity_metrics
      - style_metrics
      - wardrobing_metrics
      - coverage_limitations
      - report_only_evidence_metrics
      - reference_metrics
      - error_account
      - difficulty_calibration
      properties:
        summary:
          $ref: '#/components/schemas/ExperimentSummary'
        synthetic_only: *id011
        baseline_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        per_world_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        sensitivity_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        style_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        wardrobing_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        coverage_limitations:
          type: array
          items: *id001
        report_only_evidence_metrics: *id011
        reference_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        error_account:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        difficulty_calibration:
          $ref: '#/components/schemas/DifficultyCalibration'
    DifficultyCalibration:
      type: object
      additionalProperties: false
      required:
      - calibrated
      - levers
      - record_ref
      properties:
        calibrated:
          type: boolean
        levers:
          type: array
          items:
            type: string
        record_ref:
          type: string
          nullable: true
    TruthExample:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - y_abuse
      - action_types
      properties:
        customer_id: *id001
        y_abuse:
          type: integer
          enum:
          - 0
          - 1
        action_types:
          type: array
          items: *id001
    Health:
      type: object
      additionalProperties: false
      required:
      - alive
      - scoring_ready
      - promoted_model_ready
      - model_kind
      - queue_depth
      - worker_seconds_since_seen
      properties:
        alive: *id011
        scoring_ready: *id011
        promoted_model_ready: *id011
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
          - null
          nullable: true
        queue_depth:
          type: integer
          minimum: 0
          description: Runs waiting for the worker or being scored.
        worker_seconds_since_seen:
          type: number
          nullable: true
          description: Seconds since a scoring worker last reported; null if none ever has. Informative, not part of
            scoring_ready.
    DatasetPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        next_cursor:
          type: string
          nullable: true
    RunPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_cursor:
          type: string
          nullable: true
    ScoreBin:
      type: object
      additionalProperties: false
      required:
      - lower
      - upper
      - count
      - selected_count
      - at_or_above
      properties:
        lower:
          type: number
          minimum: 0
          maximum: 100
        upper:
          type: number
          minimum: 0
          maximum: 100
        count:
          type: integer
          minimum: 0
          description: Eligible customers whose risk score is in [lower, upper); the last bin includes 100.
        selected_count:
          type: integer
          minimum: 0
          description: Of those, the customers selected for review.
        at_or_above:
          type: integer
          minimum: 0
          description: Eligible customers scoring at or above lower, which is the queue a threshold at lower would produce.
    ScoreDistribution:
      type: object
      additionalProperties: false
      required:
      - run_id
      - eligible_count
      - review_budget
      - threshold_score
      - bin_width
      - bins
      description: How the eligible customers' risk scores spread, in twenty five-point bins from 0 to 100, with the
        queue size at any threshold. Every number is a count over the run's stored rows; nothing is recomputed and no
        threshold here changes the run's selection, which stays at threshold_score.
      properties:
        run_id: *id001
        eligible_count:
          type: integer
          minimum: 0
        review_budget:
          type: integer
          minimum: 0
          nullable: true
        threshold_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        bin_width:
          type: number
        bins:
          type: array
          items:
            $ref: '#/components/schemas/ScoreBin'
    CustomerPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        next_cursor:
          type: string
          nullable: true
    StylePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Style'
        next_cursor:
          type: string
          nullable: true
    ReviewPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        next_cursor:
          type: string
          nullable: true
    ExperimentSummaryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentSummary'
        next_cursor:
          type: string
          nullable: true
    Curves:
      type: object
      additionalProperties: false
      required:
      - synthetic_only
      - experiment_id
      - run_id
      - world_id
      - eligible_count
      - review_budget
      - heavy_returner_cutoff
      - abusers
      - legitimate_heavy_returners
      - points
      description: For a run on the demonstration world, how many abusers and how many legitimate heavy returners the model's
        first k customers and the return-rate rule's first k customers contain, for k from 1 to the eligible count. Counts
        over stored result rows and the synthetic truth export; the evaluation page only, never the queue. A legitimate heavy
        returner is a non-abuser whose raw return rate is at or above the run's heavy_returner_cutoff.
      properties:
        synthetic_only: *id011
        experiment_id: *id001
        run_id: *id001
        world_id: *id001
        eligible_count: *id008
        review_budget:
          type: integer
          minimum: 0
          nullable: true
        heavy_returner_cutoff:
          type: number
          minimum: 0
          nullable: true
        abusers: *id008
        legitimate_heavy_returners: *id008
        points:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - k
            - model_abusers_caught
            - model_legitimate_heavy_reviewed
            - baseline_abusers_caught
            - baseline_legitimate_heavy_reviewed
            properties:
              k:
                type: integer
                minimum: 1
              model_abusers_caught: *id008
              model_legitimate_heavy_reviewed: *id008
              baseline_abusers_caught: *id008
              baseline_legitimate_heavy_reviewed: *id008
    TruthPage:
      type: object
      additionalProperties: false
      required:
      - synthetic_only
      - world_id
      - items
      - next_cursor
      properties:
        synthetic_only: *id011
        world_id:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TruthExample'
        next_cursor:
          type: string
          nullable: true
  securitySchemes:
    SharedAccess:
      type: http
      scheme: basic
      description: VM reverse proxy only, an outer layer in front of the sign-in; local profile exempt
    SessionCookie:
      type: apiKey
      in: cookie
      name: arai_session
      description: Contract 1.16.0 (AM-69). The session of a verified sign-in. Roles decide each route (viewer, reviewer,
        approver, admin); a POST or DELETE also sends the session's X-CSRF-Token header.
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Contract 1.17.0 (AM-70). A Keycloak access token of the configured realm whose audience includes the
        API audience (arai-api by default), for scripts. Checked against the realm's published keys on each request (a
        result is kept for at most a minute); roles come from its groups claim; no session and no CSRF token.
security:
- SessionCookie: []
- BearerToken: []
