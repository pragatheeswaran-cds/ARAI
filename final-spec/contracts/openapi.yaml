components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: &id009
      - error_code
      - message
      - request_id
      - details
      properties: &id010
        error_code: *id001
        message: *id001
        request_id: *id001
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - rule_id
            - table
            - row_key
            - count
            properties:
              rule_id: *id001
              table:
                type: string
                nullable: true
              row_key:
                type: string
                nullable: true
              count: &id008
                type: integer
                minimum: 0
    Dataset:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - world_id
      - manifest_hash
      - schema_version
      - cutoff
      - history_start
      - purpose
      - validation_status
      - customer_count
      properties:
        dataset_id: *id001
        world_id: *id001
        manifest_hash: *id001
        schema_version:
          type: string
          enum:
          - '1.0'
        cutoff:
          type: string
          format: date-time
        history_start:
          type: string
          format: date
        purpose:
          type: string
          enum:
          - train
          - validation
          - test
          - demo
          - fixture
          - stress
          - external
        validation_status:
          type: string
          enum:
          - accepted
        customer_count: *id008
    RunRequest:
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - idempotency_key
      properties:
        dataset_id: *id001
        model_id: *id001
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    Run:
      type: object
      additionalProperties: false
      required:
      - run_id
      - dataset_id
      - world_id
      - model_id
      - model_kind
      - status
      - stage
      - progress
      - cutoff
      - created_at
      - completed_at
      - error
      - eligible_count
      - excluded_count
      - selected_count
      - model_only_count
      - baseline_only_count
      - warnings
      - review_budget
      - threshold_score
      - median_score
      - mean_return_rate
      - eligible_requested_units
      - eligible_purchased_units
      - graph_edges
      - heavy_returner_cutoff
      - community_count
      - ring_count
      properties:
        run_id: *id001
        dataset_id: *id001
        world_id: *id001
        model_id: *id001
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - interrupted
        stage: *id001
        progress:
          type: number
          minimum: 0
          maximum: 1
        cutoff:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: object
          additionalProperties: false
          required: *id009
          properties: *id010
          nullable: true
        eligible_count:
          type: integer
          minimum: 0
          nullable: true
        excluded_count:
          type: integer
          minimum: 0
          nullable: true
        selected_count:
          type: integer
          minimum: 0
          nullable: true
        model_only_count:
          type: integer
          minimum: 0
          nullable: true
        baseline_only_count:
          type: integer
          minimum: 0
          nullable: true
        warnings:
          type: array
          items:
            type: string
        review_budget:
          type: integer
          minimum: 0
          nullable: true
          description: The review budget k of this run (the primary budget fraction of the eligible customers, at least
            one). selected_count equals it whenever there are at least k eligible customers. Null until the run succeeded.
        threshold_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: The risk score of the customer at rank k, the last inside the budget; the queue is every eligible
            customer scoring at or above it. Null until the run succeeded or when the budget is zero.
        median_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Median risk score of the eligible customers. The score is a training reference percentile, so a
            snapshot like the training worlds has a median near 50. Null until the run succeeded.
        mean_return_rate:
          type: number
          minimum: 0
          nullable: true
          description: Pooled return rate of the eligible customers on mature sale lines, eligible_requested_units over
            eligible_purchased_units; the run-wide figure a customer's or a group's rate is read against. Null until
            the run succeeded or when no mature unit was purchased.
        eligible_requested_units:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of mature_requested_units over the eligible customers (the numerator of mean_return_rate).
        eligible_purchased_units:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of mature_purchased_units over the eligible customers (the denominator of mean_return_rate).
        graph_edges:
          type: integer
          minimum: 0
          nullable: true
          description: Supported relationship edges found in the snapshot (two or more shared identifier types). Null
            until the run succeeded.
        heavy_returner_cutoff:
          type: number
          minimum: 0
          nullable: true
          description: The raw return rate at the 90th percentile of this run's eligible customers (linear interpolation),
            the gate's own definition of a heavy returner. A customer at or above it who is not selected for review is a
            cleared heavy returner. Null until the run succeeded.
        community_count:
          type: integer
          minimum: 0
          nullable: true
          description: Groups of linked accounts in the snapshot, the connected components of the supported edges (a
            component of thirteen or more members is split by Louvain with a fixed seed). Null until the run succeeded.
        ring_count:
          type: integer
          minimum: 0
          nullable: true
          description: Of community_count, the groups the stated rule calls a ring (a coordinated claim match on an edge,
            two or more members selected for review, or a member with a coordinated claim share above zero). Evidence
            about the group, not a verdict on any member. Null until the run succeeded.
    Support:
      type: object
      additionalProperties: false
      required:
      - mature_sale_lines
      - mature_purchased_units
      - mature_requested_units
      - all_requested_units
      properties:
        mature_sale_lines: *id008
        mature_purchased_units: *id008
        mature_requested_units: *id008
        all_requested_units: *id008
    Signal:
      type: object
      additionalProperties: false
      required:
      - code
      - label
      - value
      - denominator
      - unit
      - source_refs
      properties:
        code: *id001
        label: *id001
        value:
          type: number
          nullable: true
        denominator:
          type: number
          nullable: true
        unit: *id001
        source_refs:
          type: array
          items: *id001
    Customer:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - eligibility_status
      - raw_score
      - risk_score
      - rank
      - selected_for_review
      - baseline_rank
      - baseline_selected
      - support_counts
      - evidence_tags
      - wardrobing_status
      - latest_disposition
      - basket_expectation
      - cleared_reason
      - community
      - tier
      - gate_outcome
      - primary_signals
      properties:
        customer_id: *id001
        eligibility_status:
          type: string
          enum:
          - eligible
          - insufficient_history
        raw_score:
          type: number
          nullable: true
        risk_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        rank:
          type: integer
          minimum: 1
          nullable: true
        selected_for_review: &id011
          type: boolean
        baseline_rank:
          type: integer
          minimum: 1
          nullable: true
        baseline_selected:
          type: boolean
        support_counts:
          $ref: '#/components/schemas/Support'
        evidence_tags:
          type: array
          items: *id001
        wardrobing_status:
          type: string
          enum:
          - elevated
          - possible
          - no_elevated_signal
          - insufficient_evidence
          - incomplete
        latest_disposition:
          type: string
          enum:
          - needs_investigation
          - likely_legitimate
          - unresolved
          - null
          nullable: true
        basket_expectation:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - actual_units
          - purchased_units
          - expected_units
          - sd
          - band_low
          - band_high
          - z
          description: Units requested for return on mature sale lines against the units a customer buying the same products
            would be expected to request, with the normal band expected +/- 2 sd, sd = sqrt(d * sum q p (1 - p)) over the
            lines with d the mean lines per order and style clipped to [1, 4]. The same quantities the model's expected
            return rate and residual z are built from; nothing is recomputed. sd, the band and z are null when every line's
            expected probability is 0 or 1, and for runs scored before contract 1.5.0.
          properties:
            actual_units: *id008
            purchased_units: *id008
            expected_units:
              type: number
              minimum: 0
            sd:
              type: number
              minimum: 0
              nullable: true
            band_low:
              type: number
              minimum: 0
              nullable: true
            band_high:
              type: number
              minimum: 0
              nullable: true
            z:
              type: number
              nullable: true
        cleared_reason:
          type: string
          nullable: true
          enum:
          - size_bracketing
          - high_return_styles
          - as_basket_predicts
          - below_threshold
          - null
          description: Why an eligible customer outside the review queue is not in it, as a template key the UI renders
            in one line; the first rule that holds of size_bracketing (half or more of mature units bought as several
            sizes of one style), high_return_styles (expected return rate of the basket .35 or more), as_basket_predicts
            (residual z below 1), else below_threshold. Null for customers in the queue and for unranked customers. A
            template, never generated text.
        community:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - id
          - kind
          - size
          description: The group of linked accounts this customer belongs to (a connected component of the supported
            edges), with its observable kind. Null for a customer with no supported edge, and for runs scored before
            contract 1.6.0. Membership of a group is evidence about the relationship, not guilt.
          properties:
            id: *id001
            kind: &id012
              type: string
              enum:
              - ring
              - household
              description: ring when any edge of the group has a coordinated claim match (both accounts claimed on the
                same style within 7 days), or two or more members are selected for review, or a member has a
                coordinated claim share above zero; household otherwise. From observed evidence only.
            size:
              type: integer
              minimum: 2
        tier:
          type: string
          nullable: true
          enum:
          - HIGH
          - MEDIUM
          - LOW
          - null
          description: Anchored to the queue, not to fixed percentiles (the score is a training reference percentile, so
            fixed bands would put a quarter of customers in the top band). HIGH is selected for review; MEDIUM scores
            90 or above and is not selected; LOW is every other eligible customer. Null for a customer without a score.
        gate_outcome:
          type: string
          nullable: true
          enum:
          - ESCALATE
          - HOLD
          - WARNING
          - LOW
          - null
          description: A presentation rule over stored results, not a model output, and the UI says so. ESCALATE is
            selected and either in a ring or with the wardrobing indicator elevated; HOLD is selected otherwise;
            WARNING is not selected and either MEDIUM or at or above the run's heavy_returner_cutoff; LOW is every
            other eligible customer. Null for a customer without a score.
        primary_signals:
          type: array
          maxItems: 3
          description: Up to three of the customer's evidence_tags, in the order the score breakdown ranks their families
            (the family whose typical values lower the score most comes first; a tag with no family comes last), each
            as a plain phrase under 40 characters with the value and denominator of the signal behind it. Nothing new is
            measured; the tags are unchanged.
          items:
            type: object
            additionalProperties: false
            required:
            - tag
            - label
            - family
            - value
            - denominator
            - unit
            properties:
              tag: *id001
              label: *id001
              family:
                type: string
                nullable: true
                enum:
                - claims
                - timing
                - expected_vs_actual
                - composition
                - volume
                - null
              value:
                type: number
                nullable: true
              denominator:
                type: number
                nullable: true
              unit: *id001
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
      - reviewer_name
      - disposition
      - note
      - idempotency_key
      properties:
        reviewer_name:
          type: string
          minLength: 1
          maxLength: 100
        disposition:
          type: string
          enum:
          - needs_investigation
          - likely_legitimate
          - unresolved
        note:
          type: string
          minLength: 1
          maxLength: 4000
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
    Review:
      type: object
      additionalProperties: false
      required:
      - review_id
      - world_id
      - customer_id
      - run_id
      - model_id
      - reviewer_name
      - disposition
      - note
      - created_at
      properties:
        review_id: *id001
        world_id: *id001
        customer_id: *id001
        run_id: *id001
        model_id: *id001
        reviewer_name: *id001
        disposition:
          type: string
          enum:
          - needs_investigation
          - likely_legitimate
          - unresolved
        note: *id001
        created_at:
          type: string
          format: date-time
    TimelineEvent:
      type: object
      additionalProperties: false
      required:
      - source_ref
      - event_type
      - observed_at
      - description
      - amount_inr
      - style_id
      - sku
      - order_id
      - order_line_no
      - quantity
      - size
      - reason_code
      - reason_group
      - day_in_window
      - window_days
      - line_status
      - item_received
      - linked_claim
      description: One source transaction of the customer. The sentence in description is built from the fact fields
        that follow it; read the fields, not the sentence. A fact that does not apply to the event kind is null, and
        every fact is null for a run scored before contract 1.4.0 (results are written once). The customer's free-text
        reason is never carried.
      properties:
        source_ref: *id001
        event_type: *id001
        observed_at: *id001
        description: *id001
        amount_inr:
          type: number
          nullable: true
        style_id:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        order_id:
          type: string
          nullable: true
          description: The sale order of the line, for a purchase and for a return of that line alike; groups the
            sizes of one style ordered together.
        order_line_no:
          type: integer
          minimum: 1
          nullable: true
        quantity:
          type: integer
          minimum: 0
          nullable: true
          description: Units ordered for a purchase; units requested for return for a return event.
        size:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true
          description: Return events only; a code of the reason codebook.
        reason_group:
          type: string
          nullable: true
          enum:
          - transaction_claim
          - item_complaint
          - fit
          - discretionary
          - null
          description: Return events only; the four groups partition the codebook (reason-groups.yaml).
        day_in_window:
          type: integer
          nullable: true
          description: Return events only; days after delivery at which the request was made.
        window_days:
          type: integer
          minimum: 0
          nullable: true
          description: The line's return window in days.
        line_status:
          type: string
          nullable: true
          description: The sale line's status for a purchase; the return line's status for a return event.
        item_received:
          type: boolean
          nullable: true
          description: Return events only; whether the returned item was received. Null when the reason needs no item back.
        linked_claim:
          type: boolean
          nullable: true
          description: Return events only; a linked account claimed on the same style within 7 days.
    Neighbor:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - shared_types
      - shared_value_count
      - supported
      - max_value_fanout
      - coordinated_claim_matches
      - risk_score
      - rank
      - selected_for_review
      - evidence_tags
      properties:
        customer_id: *id001
        shared_types:
          type: array
          items:
            type: string
            enum:
            - address
            - device
            - payment
        shared_value_count: *id008
        supported: *id011
        max_value_fanout: *id008
        coordinated_claim_matches: *id008
        risk_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: The neighbour's own risk score in this run (null if the neighbour is not eligible). A link is
            evidence about the relationship; this score says nothing about the customer whose case is shown.
        rank:
          type: integer
          minimum: 1
          nullable: true
        selected_for_review: *id011
        evidence_tags:
          type: array
          items:
            type: string
    Wardrobing:
      type: object
      additionalProperties: false
      required:
      - status
      - indicator_score
      - signals
      - limitation
      properties:
        status:
          type: string
          enum:
          - elevated
          - possible
          - no_elevated_signal
          - insufficient_evidence
          - incomplete
        indicator_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
        limitation: *id001
    Style:
      type: object
      additionalProperties: false
      required:
      - style_id
      - category
      - state
      - mature_sale_lines
      - purchased_units
      - requested_units
      - unique_returners
      - raw_return_rate
      - shrunk_return_rate
      - damage_share
      - claim_share
      - linked_claim_share
      - linked_claimers
      - quality_signal
      - targeting_signal
      properties:
        style_id: *id001
        category: *id001
        state:
          type: string
          enum:
          - quality
          - targeting
          - mixed_or_uncertain
          - no_elevated_signal
          - insufficient_support
          - no_return_evidence
        mature_sale_lines: *id008
        purchased_units: *id008
        requested_units: *id008
        unique_returners: *id008
        raw_return_rate:
          type: number
          nullable: true
        shrunk_return_rate:
          type: number
          nullable: true
        damage_share:
          type: number
          nullable: true
        claim_share:
          type: number
          nullable: true
        linked_claim_share:
          type: number
          nullable: true
        linked_claimers: *id008
        quality_signal: *id011
        targeting_signal: *id011
    Sku:
      type: object
      additionalProperties: false
      required:
      - sku
      - style_id
      - size
      - colour
      - unit_price_inr
      - mature_sale_lines
      - purchased_units
      - requested_units
      - support_status
      properties:
        sku: *id001
        style_id: *id001
        size: *id001
        colour: *id001
        unit_price_inr:
          type: number
        mature_sale_lines: *id008
        purchased_units: *id008
        requested_units: *id008
        support_status:
          type: string
          enum:
          - supported
          - insufficient_support
          - no_return_evidence
    CommunityMember:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - risk_score
      - rank
      - selected_for_review
      - eligibility_status
      - mature_requested_units
      - mature_purchased_units
      - evidence_tags
      description: A member of the community with its own result in this run. The score is the member's, and says
        nothing about the customer whose case is shown.
      properties:
        customer_id: *id001
        risk_score:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        rank:
          type: integer
          minimum: 1
          nullable: true
        selected_for_review: *id011
        eligibility_status:
          type: string
          enum:
          - eligible
          - insufficient_history
        mature_requested_units: *id008
        mature_purchased_units: *id008
        evidence_tags:
          type: array
          items: *id001
    CommunityEdge:
      type: object
      additionalProperties: false
      required:
      - a
      - b
      - types
      - coordinated_claim_matches
      description: A supported edge between two members (a sorts before b), the identifier types shared, and how many
        claim lines of either account the other matched on the same style within 7 days (the larger of the two
        directions).
      properties:
        a: *id001
        b: *id001
        types:
          type: array
          items:
            type: string
            enum:
            - address
            - device
            - payment
        coordinated_claim_matches: *id008
    Case:
      type: object
      additionalProperties: false
      required:
      - run_id
      - dataset_id
      - world_id
      - model_id
      - model_kind
      - cutoff
      - customer
      - signals
      - timeline
      - neighbors
      - styles
      - wardrobing
      - community
      - score_breakdown
      - rules_fired
      - reviews
      properties:
        run_id: *id001
        dataset_id: *id001
        world_id: *id001
        model_id: *id001
        model_kind:
          type: string
          enum:
          - supervised
          - unsupervised
          - baseline_fallback
        cutoff: *id001
        customer:
          $ref: '#/components/schemas/Customer'
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        neighbors:
          type: array
          items:
            $ref: '#/components/schemas/Neighbor'
        styles:
          type: array
          items:
            $ref: '#/components/schemas/Style'
        wardrobing:
          $ref: '#/components/schemas/Wardrobing'
        community:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - id
          - kind
          - method
          - size
          - selected_count
          - requested_units
          - purchased_units
          - coordinated_claim_matches
          - members
          - edges
          description: The customer's group of linked accounts with every member's own result and the edges between
            members, so the group can be drawn and its captions derived (requested_units over purchased_units is the
            group's return rate on mature lines; a member's rate is read against the run's mean_return_rate). Null for
            a customer with no supported edge, and for runs scored before contract 1.6.0.
          properties:
            id: *id001
            kind: *id012
            method:
              type: string
              enum:
              - components
              - louvain
              description: components when the group is a whole connected component of the supported edges; louvain
                when it is one part of a component of thirteen or more members, split on the edge weight with a fixed
                seed.
            size:
              type: integer
              minimum: 2
            selected_count: *id008
            requested_units: *id008
            purchased_units: *id008
            coordinated_claim_matches: *id008
            members:
              type: array
              items:
                $ref: '#/components/schemas/CommunityMember'
            edges:
              type: array
              items:
                $ref: '#/components/schemas/CommunityEdge'
        score_breakdown:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - method
          - typical_from
          - threshold_raw_score
          - families
          description: The score the frozen pipeline gives when one feature family sits at typical values and everything
            else stays as observed, for each of the five families that partition the 43 model features. The honest
            reading is "the score with this family at typical values"; boosted trees do not decompose additively, so
            these are never contributions that sum to the score. Each row is also the counterfactual for that family
            removed. Predict-side only; nothing is fitted and no selection changes. Null for a customer without a score
            and for runs scored before contract 1.7.0.
          properties:
            method:
              type: string
              enum:
              - family_at_typical_values
            typical_from:
              type: string
              nullable: true
              enum:
              - training
              - snapshot
              - null
              description: Whose medians stood in for a family's features. training is the bundle's frozen training
                median (the normal case); snapshot is the median of this run's eligible customers, used only when a
                bundle carries no feature quantiles.
            threshold_raw_score:
              type: number
              nullable: true
              description: The pipeline's raw score of the customer at rank k, the queue's edge; in_queue_without compares
                against it. Null when the budget is zero.
            families:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - family
                - label
                - feature_count
                - raw_score_without
                - score_without
                - delta_points
                - in_queue_without
                - tier_without
                properties:
                  family:
                    type: string
                    enum:
                    - claims
                    - timing
                    - expected_vs_actual
                    - composition
                    - volume
                  label: *id001
                  feature_count:
                    type: integer
                    minimum: 0
                    description: How many of the family's features this run's bundle reads; 0 for a family the baseline
                      fallback does not read (it scores on raw_return_rate alone).
                  raw_score_without:
                    type: number
                  score_without:
                    type: number
                    minimum: 0
                    maximum: 100
                  delta_points:
                    type: number
                    description: score_without minus the customer's risk_score; negative when the family raises the score.
                  in_queue_without:
                    type: boolean
                    description: Whether raw_score_without is at or above threshold_raw_score, everyone else unchanged.
                  tier_without:
                    type: string
                    enum:
                    - HIGH
                    - MEDIUM
                    - LOW
                    description: The tier rule applied to the re-scored customer, in_queue_without standing for selected.
        rules_fired:
          type: array
          description: The analyst rulebook's five rules as they stand for this customer, shown as rules that would have
            fired. Report-only; they are not part of the score. fired is null when the rule's training threshold is not
            in the bundle, an input is missing, or the run predates contract 1.7.0.
          items:
            type: object
            additionalProperties: false
            required:
            - rule_id
            - label
            - fired
            properties:
              rule_id:
                type: string
                enum:
                - rate_p90
                - claims_2
                - refund_ratio_p90
                - linked_claimant
                - late_half
              label: *id001
              fired:
                type: boolean
                nullable: true
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
    StyleDetail:
      type: object
      additionalProperties: false
      required:
      - run_id
      - style
      - skus
      - customer_ids
      - signals
      properties:
        run_id: *id001
        style:
          $ref: '#/components/schemas/Style'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/Sku'
        customer_ids:
          type: array
          items: *id001
        signals:
          type: array
          items:
            $ref: '#/components/schemas/Signal'
    Metric:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      - numerator
      - denominator
      - lower_95
      - upper_95
      - scope
      - code
      - ranking
      - slice
      properties:
        code:
          type: string
          nullable: true
          description: Stable identifier of what is measured (for example precision, review_rate.benign_household). Clients
            select metrics by code, ranking and slice; name and scope are display text and may be reworded.
        ranking:
          type: string
          nullable: true
          description: The ranking the metric belongs to (raw_return_rate, a candidate or a reference), when it belongs to one.
        slice:
          type: string
          nullable: true
          description: Where it was measured (validation, test, dry_run, world:<id>, budget:<fraction>, ablation, calibration,
            honest_groups, stress:<id>).
        name: *id001
        value:
          type: number
          nullable: true
        numerator:
          type: number
          nullable: true
        denominator:
          type: number
          nullable: true
        lower_95:
          type: number
          nullable: true
        upper_95:
          type: number
          nullable: true
        scope: *id001
    Candidate:
      type: object
      additionalProperties: false
      required:
      - candidate_id
      - ordinal
      - status
      - reasons
      - metrics
      properties:
        candidate_id: *id001
        ordinal: *id008
        status:
          type: string
          enum:
          - passed
          - rejected
          - error
          - not_evaluated
        reasons:
          type: array
          items: *id001
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
    ExperimentSummary:
      type: object
      additionalProperties: false
      required:
      - experiment_id
      - config_hash
      - selection_status
      - selected_model_id
      - selected_candidate_id
      - final_test_status
      properties:
        experiment_id: *id001
        config_hash: *id001
        selection_status:
          type: string
          enum:
          - not_completed
          - selected
          - no_selected_model
        selected_model_id:
          type: string
          nullable: true
        selected_candidate_id:
          type: string
          nullable: true
        final_test_status:
          type: string
          enum:
          - not_run
          - passed
          - failed
          - unverifiable
    Experiment:
      type: object
      additionalProperties: false
      required:
      - summary
      - synthetic_only
      - baseline_metrics
      - candidates
      - per_world_metrics
      - sensitivity_metrics
      - style_metrics
      - wardrobing_metrics
      - coverage_limitations
      - report_only_evidence_metrics
      - reference_metrics
      - error_account
      - difficulty_calibration
      properties:
        summary:
          $ref: '#/components/schemas/ExperimentSummary'
        synthetic_only: *id011
        baseline_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        per_world_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        sensitivity_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        style_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        wardrobing_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        coverage_limitations:
          type: array
          items: *id001
        report_only_evidence_metrics: *id011
        reference_metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        error_account:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        difficulty_calibration:
          $ref: '#/components/schemas/DifficultyCalibration'
    DifficultyCalibration:
      type: object
      additionalProperties: false
      required:
      - calibrated
      - levers
      - record_ref
      properties:
        calibrated:
          type: boolean
        levers:
