# Override for the AWS demonstration VM (docs/design/aws-deployment.md, sections 2.9 and 6). Always together with the base file:
#   docker compose -f docker-compose.yml -f deploy/aws/compose.vm.yml --profile sso up -d --build
# deploy/aws/bringup.sh writes /opt/arai/.env (APP_PROFILE=vm, the hostnames, the secrets from Parameter Store) and
# /opt/arai/nginx.conf, then runs exactly that command.
#
# Two hostnames on this VM, both public (D-044 as amended, AM-73):
#   APP_HOST    UI and API from nginx   -> api       (sign-in callback on APP_HOST)
#   AUTH_HOST   Keycloak                -> keycloak
services:
  db:
    volumes:
      - /data/postgres:/var/lib/postgresql/data                                    # the data volume, not the root disk
      - ./deploy/aws/postgres-init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro   # creates the keycloak database once

  api:
    environment:
      OIDC_REDIRECT_URI: https://${APP_HOST}/api/v1/auth/callback
      UI_ORIGINS: https://${APP_HOST}
    volumes:
      - /data/artifacts:/data/artifacts
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"          # the back channel to Keycloak goes through this VM's own nginx

  worker:
    volumes:
      - /data/artifacts:/data/artifacts
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"

  web:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/arai/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - keycloak

  keycloak:
    command: ["start", "--import-realm", "--http-port=8081"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: arai
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    depends_on:
      db:
        condition: service_healthy
