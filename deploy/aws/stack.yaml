AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ARAI demonstration VM (docs/design/aws-deployment.md, section 2.9): one EC2 instance with a separate data volume,
  a private S3 bucket for seeding and backups, an instance role for SSM and that bucket, and the web security group. Hostnames, certificates and the application stack are brought up by deploy/aws/bringup.sh.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC (the account's default VPC is fine).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet of that VPC (auto-assigns a public IPv4 address).
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, c7i-flex.large, m7i-flex.large]
    Description: >-
      The Free account plan accepts only Free Tier eligible types (t3.medium was refused on 18 Oct 2026). t3.small
      (2 GB, 0.0224 USD an hour in ap-south-1) is the always-on size; c7i-flex.large (4 GB, 0.0848) or m7i-flex.large
      (8 GB, 0.1008) for a heavy scoring session: stop, change the type, start (DuckDNS follows the new address).
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-094adff9b24048c5c
    Description: >-
      Ubuntu 24.04 LTS amd64 gp3 in ap-south-1 (Canonical, ubuntu-noble-24.04-amd64-server-20261017). Canonical's
      public SSM parameter is not visible from this account, so the id is pinned here; newest at any time with
      aws ec2 describe-images --owners 099720109477 --filters "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"
  DataVolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 10
    Description: The /data volume - artifact root, PostgreSQL data, backups staging.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub arai-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: project, Value: ARAI }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: arai-demo-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: arai-bucket-and-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Bucket.Arn
              - Sid: Objects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub ${Bucket.Arn}/*
              - Sid: Parameters
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:                                      # the path itself (GetParametersByPath --path /arai) and what is under it
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/arai
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/arai/*
      Tags:
        - { Key: project, Value: ARAI }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: arai-demo-instance
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: arai-demo-web
      # 80 and 443 from anywhere: 80 serves only the certificate challenge and the redirect; 443 is the public UI, API
      # behind TLS, the development login and nginx request limits (D-044 as amended, AM-73, AM-74, AM-75).
      # No SSH: SSM only.
      GroupDescription: ARAI demo VM - 80 and 443 from anywhere, no SSH (SSM only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: ACME challenge and redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "TLS, public" }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: outbound }
      Tags:
        - { Key: Name, Value: arai-demo-web }
        - { Key: project, Value: ARAI }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref WebSecurityGroup]
      Monitoring: false
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 16
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: arai-demo }
        - { Key: project, Value: ARAI }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # First boot only: packages, the data volume, swap. The application is brought up by deploy/aws/bringup.sh.
          set -euxo pipefail
          exec > >(tee -a /var/log/arai-userdata.log) 2>&1
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2 certbot unzip curl jq
          systemctl enable --now docker
          curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update
          # the data volume attaches a moment after the instance starts
          for i in $(seq 1 60); do [ -e /dev/nvme1n1 ] && break; sleep 5; done
          if ! blkid /dev/nvme1n1 >/dev/null 2>&1; then mkfs.ext4 -L araidata /dev/nvme1n1; fi
          mkdir -p /data
          grep -q 'LABEL=araidata' /etc/fstab || echo 'LABEL=araidata /data ext4 defaults,nofail 0 2' >> /etc/fstab
          mount -a
          mkdir -p /data/artifacts /data/postgres /data/backup
          chown 1000:1000 /data/artifacts            # the api and worker containers run as uid 1000
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          swapon -a || true
          touch /var/lib/arai-userdata-done

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: arai-demo-data }
        - { Key: project, Value: ARAI }

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  # The monthly budget "arai-monthly" (20 USD on 17 Oct 2026, 45 USD since 18 Oct 2026 for the three always-on months)
  # was created directly with the Budgets API before the account was activated for the other services, so it is not
  # part of this stack.

Outputs:
  InstanceId:
    Value: !Ref Instance
  BucketName:
    Value: !Ref Bucket
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
  PublicIp:
    Description: Changes at every stop/start (no Elastic IP by design); deploy/aws/duckdns.sh keeps DNS current.
    Value: !GetAtt Instance.PublicIp
