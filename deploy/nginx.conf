server {
    listen 80;
    client_max_body_size 520m;            # the upload limit is 500,000,000 bytes; the API enforces it exactly

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    # The page is revalidated at every visit, so a new release shows at once; its scripts and styles carry a hash of
    # their content in their names and are kept by the browser for a year.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;               # a missing file is a 404, never the page under a script's name
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;        # client-side routes
    }
}
