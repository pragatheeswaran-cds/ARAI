reason_reference_rows:
- reason_code: damaged
  description: Arrived damaged
  claim_class: item_complaint
  intent_class: mechanical
  fault_attribution: carrier
  requires_item_return: 1
  is_high_risk: 0
- reason_code: defective
  description: Faulty or stopped working
  claim_class: item_complaint
  intent_class: mechanical
  fault_attribution: retailer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: poor_quality
  description: Quality below expectation
  claim_class: item_complaint
  intent_class: mechanical
  fault_attribution: retailer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: not_as_described
  description: Differs from listing
  claim_class: item_complaint
  intent_class: mechanical
  fault_attribution: retailer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: wrong_size
  description: Size did not fit
  claim_class: fit
  intent_class: mechanical
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: didnt_fit
  description: Cut or shape did not fit
  claim_class: fit
  intent_class: mechanical
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: didnt_suit
  description: Did not suit the customer
  claim_class: preference
  intent_class: discretionary
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: changed_my_mind
  description: No longer wanted
  claim_class: preference
  intent_class: discretionary
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: not_as_expected
  description: Not what the customer pictured
  claim_class: preference
  intent_class: discretionary
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: found_better_price
  description: Cheaper elsewhere
  claim_class: preference
  intent_class: discretionary
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: ordered_by_mistake
  description: Ordered in error
  claim_class: preference
  intent_class: discretionary
  fault_attribution: customer
  requires_item_return: 1
  is_high_risk: 0
- reason_code: late_delivery
  description: Arrived too late to be wanted
  claim_class: transaction_claim
  intent_class: discretionary
  fault_attribution: carrier
  requires_item_return: 1
  is_high_risk: 0
- reason_code: wrong_item_sent
  description: A different item was sent
  claim_class: transaction_claim
  intent_class: mechanical
  fault_attribution: retailer
  requires_item_return: 1
  is_high_risk: 1
- reason_code: missing_parts
  description: Parts or pieces absent
  claim_class: transaction_claim
  intent_class: mechanical
  fault_attribution: retailer
  requires_item_return: 1
  is_high_risk: 1
- reason_code: item_not_received
  description: Parcel never arrived
  claim_class: transaction_claim
  intent_class: not_applicable
  fault_attribution: disputed
  requires_item_return: 0
  is_high_risk: 1
- reason_code: empty_package
