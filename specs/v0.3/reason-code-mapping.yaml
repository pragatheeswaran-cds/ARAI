spec_version: 0.3.0-draft
status: DECIDED 2026-09-25 (D-018 to D-021, D-041); pending user sign-off per D-006. Items marked open are not decided.
gap: G-03
principle: reasons are customer claims, not adjudications. Groups are explicit code lists, not claim_class, because late_delivery is claim_class=transaction_claim but not a deceptive-claim reason (D-018).

codebook_source: specs/02-data/schema.yaml reason_reference_rows (16 codes, unchanged)

feature_groups:
  transaction_claim:            # claim_share, coordinated_claim_share, SKU targeting transaction_claim_share
    codes: [wrong_item_sent, missing_parts, item_not_received, empty_package]
    excludes: [late_delivery]   # D-018
    rationale: the only public codes shared by genuine fulfilment failures and deceptive claims; the only coordinated action codes (D-016)
  item_complaint_customer:      # customer feature damage_reason_share (D-019)
    codes: [damaged, defective, poor_quality, not_as_described]
  item_complaint_sku_quality:   # SKU damage_share used by quality_signal (D-019)
    codes: [defective, poor_quality, not_as_described]
    excludes: [damaged]         # carrier fault; says nothing about the product
  discretionary:                # discretionary_share, wardrobing signal (D-018)
    codes: [didnt_suit, changed_my_mind, not_as_expected, found_better_price, ordered_by_mistake, late_delivery]
  fit:                          # context only (not in v0.2 allow-list)
    codes: [wrong_size, didnt_fit]
  no_item_return:               # return_received_flag null; no pickup
    codes: [item_not_received, empty_package]

generator_reason_selection:
  ordinary_fit_or_preference_return:
    draw_from: [fit, discretionary]
  genuine_defect_return:        # latent-defective unit (D-019)
    draw_from: [defective, poor_quality, not_as_described]
  carrier_damage:               # D-019; independent of SKU and customer
    code: damaged
    rate: ~0.5% of delivered lines
  genuine_fulfilment_failure:   # D-021
    rate: ~1.5% of delivered lines, all customer groups, independent of abuse propensity
    nonreceipt_on_scanned_line: item_not_received      # genuine misdelivery (D-005)
    contents: [wrong_item_sent, missing_parts, empty_package]
    code_split: {item_not_received: 0.5%, wrong_item_sent: 0.4%, missing_parts: 0.4%, empty_package: 0.2%}   # of delivered lines (D-041)
  deceptive_nonreceipt_claim:
    code: item_not_received                             # line has carrier scan (D-005)
  deceptive_contents_claim:
    codes: [wrong_item_sent, missing_parts, empty_package]
  temporary_use_return:         # D-020
    draw:
      discretionary_or_fit: ~0.85
      false_quality_complaint: ~0.15   # [poor_quality, not_as_described]
    note: no dedicated code; false quality complaints test that SKU quality evidence does not clear a wardrober (Q9)
  constraints:
    - every code used by a deceptive action is also used by genuine events in the same world (validation check)
    - realised genuine vs deceptive claim counts are reported per world; the ~1,200 vs ~650 per 10k world figure is a planning estimate, not a target
