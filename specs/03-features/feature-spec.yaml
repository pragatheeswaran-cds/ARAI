forest_allow_list:
- residual_z
- refund_ratio
- median_days_to_return_z
- claim_mix
- device_fanout
- address_fanout
- payment_fanout
- trend_90d
categorical_reference_features: is_occasion_wear and intent_class converted to documented
  booleans only; no one-hot expansion approved
not_model_inputs:
- customer_id
- sku
- account_status
- loyalty_tier
- marketing_channel
- reason_text
- raw_rate
- n_returns
- population
- ring_id
- household_id
- base_return_rate
derived_output_contracts:
  sku_features:
    key:
    - sku
    n_sales: count eligible sales lines for SKU; Q-002
    n_returns: count eligible returned lines for SKU; Q-002
    raw_rate: n_returns/n_sales; zero denominator null
    reason_mix: counts/shares by approved reason classes; denominator/status Q-002
    n_returners: count distinct eligible customer_id with a SKU return
    top_community_share: same quantity as connectivity; community selection Q-006
  identity_edges:
    key:
    - account_a
    - account_b
    shared_types: distinct surviving identifier types
    weight: sum 1/log2(1+d(v)) over shared surviving values
    contributing_degrees: map each contributing hashed value/type to distinct-account
      degree; raw values forbidden
    ordering: account-pair canonical ordering TBD Q-012
  communities:
    key:
    - customer_id
    component_id: connected-component membership
    louvain_id: seeded Louvain membership
    community_size: distinct member customer count
    label_ordering: stable label assignment TBD Q-012
  scores:
    key:
    - customer_id
    - pass
    contract: ../05-inference/prediction-contract.yaml
  wardrobe_band:
    contract: ../04-model/threshold-policy.yaml
    signals_fired: names of true approved five booleans
  latency_z_alias: LLD M07 latency_z versus M09 median_days_to_return_z equivalence
    is unapproved; resolve Q-004 before implementation
