features:
- id: FEAT-001
  name: n_orders
  meaning: purchase frequency
  source_columns:
  - sales_order.order_id
  type: integer
  transformation: count distinct eligible order_id per customer
  range: '>=0'
  null_handling: zero for empty history
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-002
  status: BLOCKED
- id: FEAT-002
  name: n_lines
  meaning: Bernoulli exposures
  source_columns:
  - sales_order_line.order_id
  - sales_order_line.order_line_no
  type: integer
  transformation: count eligible sales lines per customer
  range: '>=0'
  null_handling: zero
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-002
  status: BLOCKED
- id: FEAT-003
  name: n_returns
  meaning: observed returned exposures
  source_columns:
  - return_order_line.order_id
  - return_order_line.order_line_no
  - return_order.return_status
  type: integer
  transformation: count eligible returned sales lines; not units; status eligibility
    unresolved
  range: 0..n_lines
  null_handling: zero
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: outcome known only after observation period; excluded from forest
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-002
  status: BLOCKED
- id: FEAT-004
  name: spend
  meaning: purchase value excluding shipping
  source_columns:
  - sales_order_line.line_total
  type: number
  transformation: sum eligible line_total
  range: '>=0'
  null_handling: zero
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-002
  status: BLOCKED
- id: FEAT-005
  name: tenure_days
  meaning: account age
  source_columns:
  - customer_master.signup_date
  - run_date
  type: integer
  transformation: (run_date - signup_date).days
  range: '>=0'
  null_handling: no first-order substitution; missing master fails
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: archive master absent Q-001
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: null
  status: specified subject to input eligibility Q-002
- id: FEAT-006
  name: raw_rate
  meaning: baseline comparator
  source_columns:
  - n_returns
  - n_lines
  type: number
  transformation: n_returns / n_lines
  range: '[0,1]'
  null_handling: null if no eligible lines
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: evaluation comparator/display only; never forest input
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-002
  status: BLOCKED
- id: FEAT-007
  name: mu_cat
  meaning: category empirical return prior
  source_columns:
  - sku_master.category
  - eligible sales/return lines
  type: number
  transformation: sum category returned lines / sum category sales lines; exclusions
    and empty-category fallback TBD
  range: '[0,1]'
  null_handling: TBD Q-006
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: never generator base_return_rate; own/community contributions may
    remain in prior
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-006
  status: BLOCKED
- id: FEAT-008
  name: shrunk_rate
  meaning: SKU rate shrunk to observed category
  source_columns:
  - N_s
  - R_s
  - mu_cat
  type: number
  transformation: (R_s + k*mu_cat)/(N_s+k), k=20
  range: '[0,1]'
  null_handling: zero sales gives mu_cat
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: null
  status: specified subject to input eligibility Q-002
- id: FEAT-009
  name: p_hat
  meaning: customer-specific SKU expectation
  source_columns:
  - SKU totals
  - customer SKU contributions
  - exclude
  - mu_cat
  type: number
  transformation: (R_s - R_Cs + k*mu_cat)/(N_s - N_Cs + k) in pass 1; pass 2 exclusion
    union semantics in transformations
  range: '[0,1]'
  null_handling: sole buyer gives mu_cat
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-006
  status: BLOCKED
- id: FEAT-010
  name: expected_returns
  meaning: expected count for basket
  source_columns:
  - p_hat
  type: number
  transformation: sum(p_hat_i) over customer eligible lines
  range: '[0,n_lines]'
  null_handling: empty basket zero
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: null
  status: specified subject to input eligibility Q-002
- id: FEAT-011
  name: variance
  meaning: Poisson-binomial null variance
  source_columns:
  - p_hat
  type: number
  transformation: sum(p_hat_i*(1-p_hat_i))
  range: '>=0'
  null_handling: empty basket zero
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: null
  status: specified subject to input eligibility Q-002
- id: FEAT-012
  name: design_effect
  meaning: within-order/style dependence adjustment
  source_columns:
  - sales_order_line.order_id
  - sku_master.style_id
  type: number
  transformation: min(4.0, mean(count lines per (order_id, style_id) group))
  range: '[1,4]'
  null_handling: thin-history 1.5 fallback trigger unspecified
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-004
  status: BLOCKED
- id: FEAT-013
  name: residual_z
  meaning: design-adjusted basket excess
  source_columns:
  - n_returns
  - expected_returns
  - variance
  - design_effect
  type: number
  transformation: (n_returns-expected_returns)/sqrt(variance*design_effect)
  range: finite real or null
  null_handling: null if n_lines<3 or variance=0; forest/ranking treatment TBD
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: true
  blocking_question: Q-004
  status: BLOCKED
- id: FEAT-014
  name: refund_ratio
  meaning: paid refunds relative to spend
  source_columns:
  - return_order_line.refund_amount
  - sales_order_line.line_total
  type: number
  transformation: sum paid eligible refund_amount / sum eligible line_total; shipping
    excluded
  range: '[0,1] under valid linked eligibility'
  null_handling: zero-denominator treatment TBD
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: true
  blocking_question: Q-004
  status: BLOCKED
- id: FEAT-015
  name: median_days_to_return
  meaning: typical return latency
  source_columns:
  - return_order_line.days_to_return
  - sales_order_line.delivered_date
  - return_order.return_created_date
  type: number
  transformation: median eligible return latency per customer; timestamp source Q-003
  range: '>=1 or null'
  null_handling: no-return treatment TBD
  categorical_encoding: none; forest features are numeric
  availability: complete batch snapshot at run_date; not point-of-return
  leakage_risk: as-of data only
  consistency: one versioned transform path for generated/upload and both passes
  forest_input: false
  blocking_question: Q-003
  status: BLOCKED
