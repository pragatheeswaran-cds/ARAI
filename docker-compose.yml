# Reference runtime (final-spec component 15): PostgreSQL, API, one worker and the static UI.
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up --build
# UI: http://localhost:8080   API: http://localhost:8080/api/v1/health
# Only the artifacts folder of the current experiment is mounted (experiment.yaml data_root; ARAI_ARTIFACTS overrides it).
# Its private folder (simulation truth) is never visible to these containers.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: arai
    volumes:
      - pgdata_exp_20261005_04:/var/lib/postgresql/data      # one database per experiment, like its data folder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arai -d arai"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no published port: the database is reachable only from the other services

  api:
    build: .
    restart: unless-stopped
    environment: &service_env
      DATABASE_URL: postgresql://arai:${POSTGRES_PASSWORD}@db:5432/arai
      ARTIFACT_ROOT: /data/artifacts
      APP_PROFILE: ${APP_PROFILE:-local}
      UI_ORIGINS: ${UI_ORIGINS:-http://localhost:8080}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    volumes:
      - ${ARAI_ARTIFACTS:-./data/EXP-20261005-04/artifacts}:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "arai", "worker"]
    environment: *service_env
    volumes:
      - ${ARAI_ARTIFACTS:-./data/EXP-20261005-04/artifacts}:/data/artifacts
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"          # loopback only; put a TLS reverse proxy in front for the VM profile
    depends_on:
      - api

volumes:
  pgdata_exp_20261005_04:
