[project]
name = "arai"
version = "0.1.0"
description = "Adaptive Return Abuse Intelligence: synthetic worlds, validation and investigation demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.26.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skops>=0.16.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
arai = "arai.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=7.4.0",
    "jsonschema>=4.26",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "openapi-spec-validator>=0.7",
    "pgserver>=0.1.4",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
