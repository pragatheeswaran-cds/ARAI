[project]
name = "arai"
version = "0.1.0"
description = "Adaptive Return Abuse Intelligence: synthetic worlds, validation and investigation demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.115",
    "httpx>=0.27",                 # the back channel of single sign-on (service/oidc.py); not only a test dependency
    "jsonschema>=4.26.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skops>=0.16.0",
    "uvicorn>=0.30",
]

[project.scripts]
arai = "arai.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jsonschema>=4.26",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "openapi-spec-validator>=0.7",
    "pgserver>=0.1.4",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py312"
# Hash-locked or contract-bound code is never edited for style: every model bundle records the hash of the five scoring
# files (bundles.CODE_FILES, code_sha256), and the generator package must keep producing byte-identical worlds.
extend-exclude = [
    "src/arai/features.py",
    "src/arai/dataset.py",
    "src/arai/modeling.py",
    "src/arai/bundles.py",
    "src/arai/ranking.py",
    "src/arai/generator",
]

[tool.ruff.lint]
# the code packs related names onto one import line; isort's one-name-per-line layout is not this codebase's style
ignore = ["I001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and query parameters as argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
